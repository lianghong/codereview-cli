# Model Configuration for Code Review Tool
# This file defines all available AI models
# for code review analysis
#
# Pricing/parameters researched: January 2026
# Sources: AWS Bedrock, Azure OpenAI,
#   Anthropic, Moonshot, Alibaba, Zhipu

---
version: "1.1"

providers:
  # AWS Bedrock Provider
  bedrock:
    region: us-east-1
    models:
      # Claude Models (Anthropic)
      # Best for: Code review, reasoning, security
      - id: fable5
        full_id: us.anthropic.claude-fable-5
        name: Claude Fable 5
        # Geo-US profile is us-east-1 only, and the provider_data_share
        # data-retention opt-in it requires is per-region account state -
        # invoking from the provider default (us-west-2) fails with
        # "data retention mode 'default' is not available for this model".
        region: us-east-1
        # Adaptive thinking is always on and the Converse call is
        # non-streaming, so no bytes arrive until the full response is
        # generated - think-heavy batches outlast the provider-default
        # read_timeout (300s); observed ReadTimeoutError at 5+ minutes.
        read_timeout: 1800
        aliases:
          - claude-fable-5
          - fable-5
          - fable
        pricing:
          input_per_million: 10.00
          output_per_million: 50.00
        inference_params:
          # Fable 5 requires temperature to be 1.0-or-unset, top_p to be
          # >=0.99-or-unset, and rejects top_k entirely (Bedrock model card,
          # June 2026) - omit all sampling params
          max_output_tokens: 128000
        context_window: 1000000
        # Adaptive thinking is always on and cannot be disabled (Bedrock model
        # card), so it should reproduce the forced-tool_choice-while-thinking
        # failure constantly rather than intermittently - see the opus5 entry
        # below for what was observed on that path (a tool call returned as
        # literal text, so CodeReviewReport.issues fails with a list_type
        # error). Unverified live on this model: assume-prompt-parsing rule.
        # Note Anthropic documents forced tool use as SUPPORTED with adaptive
        # thinking (the auto/none-only rule is specific to manual
        # thinking.type: "enabled"), so the cause is not a documented API
        # restriction; the empirical failure is what drives this flag.
        # Route structured output through prompt-based JSON parsing.
        supports_tool_use: false
        capabilities:
          - code_review
          - security_analysis
          - reasoning
          - vision
          - adaptive_thinking
        notes: >-
          Mythos-class flagship (June 2026) for complex knowledge work and
          coding. 1M-token context, up to 128K output. Adaptive thinking is
          always on - temperature/top_p/top_k not configurable, and structured
          output uses prompt-based JSON parsing (supports_tool_use: false).
          Requires a one-time account opt-in to provider data sharing
          (Data Retention API, mode=provider_data_share) before invocation.
          Dual-use prompts fall back to Opus 4.8 server-side and are billed
          at Opus rates. Geo-US inference profile; in-region us-east-1 only.

      - id: opus5
        full_id: us.anthropic.claude-opus-5
        name: Claude Opus 5
        # Thinking is ON by default (breaking change from Opus 4.8, where it
        # was off unless requested) at default effort "high", and the Converse
        # call is non-streaming - so no bytes arrive until the full response is
        # generated. Same condition that forced Fable 5's override; think-heavy
        # batches outlast the provider-default read_timeout (300s).
        read_timeout: 1800
        # Generation-neutral aliases track the current generation, so `opus`
        # and `claude-opus` point here. This entry also absorbed the
        # version-explicit aliases of the removed Opus 4.7 / 4.6 entries
        # (2026-07-25) so existing --model invocations keep resolving.
        aliases:
          - opus
          - claude-opus
          - claude-opus-5
          - opus-5
          - claude-opus5
        # 2026-07-25: the Opus 4.7 / 4.6 back-compat aliases (opus4.7,
        # opus-4.7, claude-opus-4.7, claude-opus-47, opus4.6, opus-4.6,
        # claude-opus-4.6) were deleted, not migrated - `--model opus4.6` now
        # fails fast rather than silently resolving to a two-generations-newer
        # model. Use `opus` (generation-neutral) or `opus5`.
        pricing:
          # Verified: AWS Bedrock model card / Anthropic pricing (July 2026).
          # Unchanged from Opus 4.8.
          input_per_million: 5.00
          output_per_million: 25.00
        inference_params:
          # Reasoning model - temperature/top_p/top_k not supported.
          # default_temperature omitted intentionally.
          max_output_tokens: 128000
        context_window: 1000000
        # Unlike the other adaptive-thinking Claude entries, this one is not an
        # assume-prompt-parsing guess: the Bedrock model card lists "Structured
        # outputs: Not Supported" for both the bedrock-runtime and
        # bedrock-mantle endpoints. Thinking-on-by-default also reproduces the
        # Opus 4.8 failure: .with_structured_output() forces a tool_choice, the
        # tool call comes back as literal text, and CodeReviewReport.issues
        # fails with a list_type error. That failure is observed, not a
        # documented API restriction - Anthropic states forced tool use IS
        # supported with adaptive thinking, and only manual
        # thinking.type: "enabled" is limited to auto/none.
        # Route through prompt-based JSON parsing.
        supports_tool_use: false
        capabilities:
          - code_review
          - security_analysis
          - reasoning
          - computer_use
          - adaptive_thinking
          - vision
        notes: >-
          Most capable Opus model (July 2026) and first of the Claude 5
          generation's Opus tier; step-change gains in deep reasoning,
          agentic/long-horizon coding, and code review and bug-finding at
          Opus 4.8 pricing. 1M-token context (default and maximum), up to 128K
          output. Thinking is on by default - effort (low/medium/high/xhigh/max,
          default high) is the control for depth, and disabling thinking is
          rejected above high effort. Structured output uses prompt-based JSON
          parsing (supports_tool_use: false). Zero data retention on by default,
          so no provider_data_share opt-in (unlike Fable 5). Geo-US inference
          profile; In-Region us-east-1, Geo/Global route more broadly.

      # Opus 4.7 and Opus 4.6 removed 2026-07-25, Opus 4.8 removed 2026-08-29:
      # the whole pre-5 Opus tier is gone. 4.7/4.6 were superseded by
      # opus4.8/opus5 at identical $5/$25 pricing (4.6 also had only a 200K
      # context); 4.8 was superseded by opus5 at the same $5/$25, same 1M
      # context and same 128K output, so it added no capability and no cheaper
      # tier — it was cut as CURATION, not because it died. `us.anthropic.
      # claude-opus-4-8` is still ACTIVE on Bedrock (verified against
      # ListFoundationModels 2026-08-29), so re-add from git history if a
      # specific 4.8-vs-5 comparison is ever needed. Every 4.8 identifier was
      # DELETED, not migrated — the entry id `opus4.8` plus `claude-opus-4.8`,
      # `opus-4.8` and `claude-opus-48` all state a version, and `opus`/
      # `claude-opus` were already on opus5.

      - id: sonnet5
        full_id: us.anthropic.claude-sonnet-5
        name: Claude Sonnet 5
        # Generation-neutral `sonnet`/`claude-sonnet` moved here 2026-08-29 when
        # the Sonnet 4.6 entry was removed - see the removal note below. They are
        # `aliases`, not `deprecated_aliases`: this IS the current Sonnet, so the
        # names stay truthful and advertisable.
        aliases:
          - sonnet
          - claude-sonnet
          - claude-sonnet-5
          - sonnet-5
          - claude-sonnet5
        pricing:
          # Standard rates ($3/$15). A launch promo of $2/$10 runs through
          # 2026-08-31 on both Bedrock and Anthropic; we register the durable
          # standard price so cost previews don't silently under-report once
          # the promo lapses (unchanged from Sonnet 4.6's rates).
          input_per_million: 3.00
          output_per_million: 15.00
        inference_params:
          # Sonnet 5 rejects temperature/top_p/top_k with a 400 (same
          # constraint as Opus 5 and Fable 5) - omit all sampling params.
          # default_temperature omitted intentionally.
          max_output_tokens: 128000
        context_window: 1000000
        # First Sonnet-tier model with adaptive thinking on by default, engaged
        # server-side per request. Anthropic forbids a forced tool_choice while
        # thinking is active (only "auto"/"none" allowed), but
        # .with_structured_output() sets exactly that forced tool_choice - so on
        # batches where the model thinks, the tool call comes back as literal
        # text and CodeReviewReport.issues fails with a list_type error. Same
        # incompatibility as Opus 5. Route through prompt-based JSON
        # parsing instead.
        supports_tool_use: false
        capabilities:
          - code_review
          - coding
          - agents
          - computer_use
          - reasoning
          - adaptive_thinking
          - vision
        notes: >-
          Latest Sonnet model (June 2026), first of the Claude 5 generation's
          Sonnet tier. Near-Opus intelligence at Sonnet pricing. 1M-token
          context, up to 128K output. Adaptive thinking on by default; rejects
          temperature/top_p/top_k, and structured output uses prompt-based JSON
          parsing (supports_tool_use: false), same as Opus 5. Uses an
          updated tokenizer (~1.0-1.35x more tokens than Sonnet 4.6). Ships with
          real-time cybersecurity safeguards (same as Opus 5). Geo-US
          inference profile; routes us-east-1/us-east-2/us-west-2.

      # Sonnet 4.6 removed 2026-08-29: superseded by sonnet5 above at the SAME
      # $3/$15, with 5x the context (1M vs 200K) and double the output cap
      # (128K vs 64K), so the older entry bought nothing. Cut as CURATION -
      # `global.anthropic.claude-sonnet-4-6` is still ACTIVE on Bedrock
      # (ListFoundationModels, 2026-08-29), so re-add from git history if a
      # 4.6-vs-5 comparison is wanted. Note what re-adding costs you: 4.6 was
      # the last Sonnet-tier entry that ACCEPTED temperature (0.1) and used the
      # tool-use structured-output path, both of which Sonnet 5 gives up.
      #
      # Alias disposition: the generation-neutral `sonnet` (the removed entry's
      # id) and `claude-sonnet` MIGRATED up to sonnet5, as `aliases` - they name
      # the Sonnet tier, not a version, and sonnet5 is that tier now. The
      # version-explicit `sonnet4.6` and `claude-sonnet-4.6` were DELETED, so
      # `--model sonnet4.6` fails fast instead of quietly answering from a
      # different generation with different sampling-param and structured-output
      # behavior.

      - id: haiku
        full_id: >-
          global.anthropic.claude-haiku-4-5-20251001-v1:0
        name: Claude Haiku 4.5
        aliases:
          - claude-haiku
        pricing:
          input_per_million: 1.00
          output_per_million: 5.00
        inference_params:
          default_temperature: 0.1
          max_output_tokens: 64000
        context_window: 200000
        capabilities:
          - code_review
          - real_time_assistants
          - parallel_agents
        notes: >-
          73.3% SWE-bench Verified, fast and
          cost-effective

      # Kimi K2.5 (Bedrock) removed 2026-08-29: `moonshotai.kimi-k2.5` is still
      # ACTIVE on Bedrock (ListFoundationModels, 2026-08-29) - this was CURATION.
      # It was a re-host of a model this registry already carries from its
      # canonical owner: the Moonshot direct provider ships the newer K2.6
      # (`kimi`), at $0.60 in / $2.50 out against the re-host's $0.60 / $3.00, so
      # the direct API is both newer and cheaper on output. Bedrock's Converse
      # parsing for Moonshot models also leaked internal tool-call markers
      # (<|tool_call_begin|>...) into the text field, which is why the entry was
      # supports_tool_use: false; nothing about that improves on the direct API.
      #
      # Alias disposition: the version-neutral `kimi-bedrock` MIGRATED to the
      # Moonshot-direct `kimi-k2.6`, the same move `kimi-azure` made when that
      # deployment went away. It names the Kimi family, and the target really is
      # a Kimi - the provider suffix becomes a lie, which is why it lands in
      # `deprecated_aliases` (resolvable, unadvertised) rather than `aliases`.
      # Unlike the deleted `qwen*-nvidia` names it crosses no billing boundary in
      # the surprising direction: Moonshot-direct is cheaper than the Bedrock
      # re-host it replaces. The version-explicit `kimi25-bedrock` was DELETED,
      # along with the entry id `kimi-k2.5-bedrock`.

      # Qwen3 Coder 480B (Bedrock) removed 2026-07-25 and Qwen3 Coder Next
      # (Bedrock) removed 2026-08-29 - NO Qwen model remains anywhere in this
      # registry:
      #   qwen.qwen3-coder-480b-a35b-v1:0  not offered in us-east-1 (it exists
      #     only in us-west-2, where qwen3-coder-next in turn is absent)
      #   qwen.qwen3-coder-next            still ACTIVE, removed as curation
      # Qwen3 Coder Next was the registry's cheapest Bedrock entry ($0.50/$1.20)
      # and one of only three Bedrock entries on the TOOL-USE structured-output
      # path; `haiku` ($1.00/$5.00) now carries both of those roles alone. That
      # is the cost of this removal, recorded here so re-adding is an informed
      # choice rather than a rediscovery.
      #
      # Every Qwen identifier was DELETED, including the version-neutral `qwen`
      # and `qwen-coder` that the removal convention would normally migrate -
      # there is no Qwen model left to migrate them onto, so the whole family
      # fails fast (same reasoning as `step-flash` in the nvidia block). Also
      # deleted: the entry ids `qwen-next-bedrock` and `qwen-bedrock`, plus
      # `qwen-next`, `qwen3-next` and `qwen-coder-next`.

      # MiniMax M2.5 (Bedrock) removed 2026-08-29, and with it the last MiniMax
      # entry on Bedrock: `minimax.minimax-m2.5` is still ACTIVE there
      # (ListFoundationModels, 2026-08-29), so this was CURATION. It was
      # superseded within the registry by `minimax-m3` on NVIDIA NIM - a newer
      # generation on a free endpoint - while its own pricing was never published
      # by AWS (the entry shipped $0.00/$0.00 placeholders, which surface as
      # "Estimated cost: TBD" rather than a real number, so --dry-run could not
      # price a run against it).
      #
      # `mm2.5-bedrock` and the entry id `minimax-m2.5-bedrock` were both
      # DELETED: version-explicit, and pointing a `-bedrock` name at NVIDIA would
      # cross a provider and a billing boundary (billed Bedrock -> free NIM tier)
      # while claiming to be Bedrock. Joins the already-deleted `mm25`/`mm2.7`
      # names from the earlier MiniMax passes.

      # GLM 5 Model (Zhipu AI via Bedrock)
      # Frontier-class model optimized for systems engineering
      # 200K context window, 128K max output
      # Best for: Complex reasoning, long-horizon agentic tasks
      - id: glm5-bedrock
        full_id: zai.glm-5
        name: GLM 5 (Bedrock)
        aliases:
          - glm-5-bedrock
        # Migrated here 2026-08-29 from the removed GLM-5.2 (NVIDIA) entry,
        # whose endpoint NVIDIA end-of-lifed 2026-08-21 (see the removal note
        # in the nvidia block). These version-neutral spellings say GLM *5*,
        # and this entry is the GLM 5 they name — so unlike the NVIDIA-suffixed
        # GLM names, which were deleted, these resolve to the model they
        # advertise. Kept back-compat-only rather than promoted to `aliases`
        # because reaching them now means a different provider and a billed
        # endpoint instead of NIM's free tier. Hidden from --list-models
        # unless --verbose.
        deprecated_aliases:
          - glm5
          - glm-5
        pricing:
          # TBD - update when AWS publishes
          input_per_million: 0.00
          output_per_million: 0.00
        inference_params:
          # Lowered from 1.0 for non-creative code review.
          # Model docs recommend 0.5-0.7 for structured tasks.
          default_temperature: 0.5
          default_top_p: 0.95
          max_output_tokens: 128000
        context_window: 200000
        # GLM-5 is a thinking model with reasoning on by default
        # (reasoning_effort defaults to max), so a forced tool_choice is
        # auto-downgraded / returned as text while thinking — the same
        # incompatibility the GLM-5.2-on-Z.AI entry routes around.
        # Assume prompt-based JSON parsing until a live run proves tool-use.
        supports_tool_use: false
        capabilities:
          - reasoning
          - code_review
          - code_generation
          - agentic_tasks
          - tool_use
        notes: >-
          Frontier-class model optimized for complex systems
          engineering and long-horizon agentic tasks,
          multi-step reasoning, advanced coding, tool-augmented
          workflows. Prompt-based JSON parsing (thinking on by default).

  # Azure OpenAI Provider
  azure_openai:
    endpoint: "${AZURE_OPENAI_ENDPOINT}"
    api_key: "${AZURE_OPENAI_API_KEY}"
    api_version: "2025-04-01-preview"
    models:
      # GPT-5.4 Model (base, non-Pro)
      # Frontier reasoning model, GPT-5 family
      # Best for: Code review, complex reasoning, structured output
      # Note: Reasoning model — temperature/top_p NOT supported.
      #   Tool calling IS supported (unlike GPT-5.4 Pro and
      #   DeepSeek-V4-Pro on Azure), so with_structured_output works
      #   without falling back to prompt-based JSON parsing.
      - id: gpt-5.4
        deployment_name: gpt-5.4
        name: GPT-5.4
        aliases:
          - gpt
          - gpt54
          - gpt5.4
        pricing:
          # Azure Foundry standard tier (≤272K input).
          # Confirmed by Microsoft staff (Q&A 2026-03-28),
          # matches OpenAI direct pricing 1:1.
          # >272K long-context tier costs 2x input / 1.5x output:
          # $5.00 / $22.50 — apply manually if you routinely send
          # prompts larger than 272K.
          input_per_million: 2.50
          output_per_million: 15.00
        inference_params:
          # No default_temperature / default_top_p: GPT-5 reasoning
          # models reject these parameters. Reasoning effort defaults
          # to 'medium' on the API side; explicit setting omitted so
          # operators can override per request without a config edit.
          max_output_tokens: 128000
        # Reasoning summaries (chain-of-thought) require Responses API
        # — same rationale as GPT-5.4 Pro and the rest of the GPT-5
        # series on Azure.
        use_responses_api: true
        context_window: 1050000
        capabilities:
          - reasoning
          - code_review
          - security_analysis
          - structured_output
          - function_calling
          - tool_use
        notes: >-
          Frontier reasoning model, 1.05M context,
          128K output, supports reasoning.effort
          low/medium/high/xhigh. Tool calling enabled
          → with_structured_output works directly.

      # GPT-5.4 Pro Model
      # Deeper reasoning variant of GPT-5.4
      # Best for: Complex reasoning, hard problems
      # Note: Responses API only, no structured outputs
      #   but function calling works for structured output
      - id: gpt-5.4-pro
        deployment_name: gpt-5.4-pro
        name: GPT-5.4 Pro
        aliases:
          - gpt54-pro
          - gpt-pro
        pricing:
          input_per_million: 30.00
          output_per_million: 180.00
        inference_params:
          # Temperature/top_p NOT supported with
          # reasoning models (GPT-5.4 Pro always
          # uses reasoning: medium/high/xhigh)
          max_output_tokens: 128000
        # GPT-5.4 Pro uses Responses API
        use_responses_api: true
        context_window: 1050000
        capabilities:
          - reasoning
          - code_review
          - security_analysis
          - function_calling
          - computer_use
        notes: >-
          Deeper reasoning variant of GPT-5.4,
          uses more compute for harder problems,
          supports reasoning.effort medium/high/xhigh

      # Kimi K2.5 (Azure) and DeepSeek-V4-Pro (Azure) removed 2026-07-25: both
      # deployments return DeploymentNotFound on this Azure resource (verified
      # live), and unlike Bedrock/NVIDIA an Azure entry only works if someone
      # has explicitly created a deployment with that exact name. Both models
      # stay reachable via their canonical direct providers: `kimi-k2.6`
      # (Moonshot) and `deepseek-v4-pro` (DeepSeek direct). Re-add from git
      # history if you deploy them on Foundry again.

  # NVIDIA NIM API Provider
  # Models available via build.nvidia.com
  nvidia:
    api_key: "${NVIDIA_API_KEY}"
    # base_url: "${NVIDIA_BASE_URL}"
    # 15 min for 202 polling
    polling_timeout: 900
    # Retry 504/502/503 up to 5 times
    max_retries: 5
    models:
      # Mistral Small 4 119B (NVIDIA) and Mistral Medium 3.5 128B (NVIDIA)
      # removed 2026-08-29: both endpoints are GONE from the live NIM catalog
      # (GET /v1/models) and a completion answers HTTP 410 with NVIDIA's own
      # end-of-life date attached —
      #   mistralai/mistral-small-4-119b-2603  EOL 2026-07-27
      #   mistralai/mistral-medium-3.5-128b    EOL 2026-08-07
      # Dead endpoints, not merely superseded, and NIM now carries no Mistral
      # newer than mistral-large-2 / mistral-nemotron, so there is no successor
      # to migrate onto and no Mistral model left in this registry. Every
      # identifier was deleted rather than redirected (`mistral-small`,
      # `mistral-small-4`, `ms4`, `mistral-medium`, `mistral-medium-3.5`, and
      # both entry ids): a Mistral name resolving to a non-Mistral model would
      # be worse than the error a human reads and fixes. Re-add from git
      # history if NVIDIA publishes a Mistral Small/Medium successor.
      #
      # NOTE: mistral-medium-nvidia was the only entry in this file carrying
      # `inference_params.reasoning_effort`. The knob is still parsed, still
      # forwarded by the NVIDIA provider, and still covered by
      # tests/test_nvidia_provider.py — it simply has no live user here now.

      # MiniMax M2.7 (via NVIDIA)
      # MoE: 230B total, 10B active (62 layers,
      # 256 experts, 8 activated per token)
      # 204,800 input context length
      # Best for: Complex software engineering,
      # agentic tool use, long-horizon workflows
      # MiniMax M2.7 (NVIDIA) removed 2026-07-25: superseded by MiniMax M3
      # below (1M context vs 204K, multimodal, same free endpoint). The M2.7
      # endpoint is still live on NIM, so re-add from git history if needed.
      # M3 is the only MiniMax on NIM; the M2.7/M2.5 aliases were deleted
      # 2026-07-25 rather than migrated onto it.

      # MiniMax M3 Preview (via NVIDIA)
      # Multimodal MoE vision-language model:
      # 428B total, ~22B active per token (A22B),
      # ViT vision encoder for image/video; text-only output
      # 1M-token input context; long-form video up to 30 min
      # Best for: long-horizon coding (8+ hrs), agentic tool
      # use, multimodal + long-context reasoning
      # Note: reasoning/thinking model — routes through
      #   prompt-based JSON parsing (supports_tool_use: false)
      #   per the "assume prompt-parsing until a live run proves
      #   tool-use" rule for new reasoning models.
      - id: minimax-m3-nvidia
        full_id: minimaxai/minimax-m3
        name: MiniMax M3 (NVIDIA)
        # Generation-neutral `minimax`/`mm` names track the current generation.
        # M3-only names. The inherited M2.7/M2.5 aliases were deleted
        # 2026-07-25 (see the note below the alias list).
        aliases:
          - minimax-m3
          - mm3-nvidia
          - mm3
        # 2026-07-25: the M2.5 / M2.7 back-compat aliases (minimax-m2.5,
        # mm25, minimax-m2.5-nvidia, mm2.5-nvidia, minimax-m2.7,
        # minimax-m2.7-nvidia, mm2.7-nvidia, mm27) were deleted, not migrated -
        # they named models whose NIM endpoints are gone. Use `minimax-m3`.
        pricing:
          # Free/non-commercial NVIDIA NIM trial endpoint
          input_per_million: 0.00
          output_per_million: 0.00
        inference_params:
          # MiniMax house recommendation (matches M2.7):
          # temperature=1.0, top_p=0.95, top_k=40
          default_temperature: 1.0
          default_top_p: 0.95
          default_top_k: 40
          # Headroom for thinking tokens + report (matches M2.7)
          max_output_tokens: 128000
          # Interleaved thinking for deeper code analysis
          enable_thinking: true
          clear_thinking: false
        # Input Context Length (ISL): 1,000,000
        context_window: 1000000
        # Reasoning model: forced tool_choice while thinking is
        # unproven on this endpoint — prompt-based JSON parsing
        supports_tool_use: false
        architecture: "MoE (428B total, ~22B active, multimodal)"
        capabilities:
          - code_review
          - code_generation
          - reasoning
          - agentic_tasks
          - thinking
          - multimodal
        notes: >-
          Multimodal MoE vision-language model (text/image/video
          in, text out), 1M-token context, long-form video to
          30 min, long-horizon coding (8+ hrs). Non-commercial
          NVIDIA NIM trial endpoint. Prompt-based JSON parsing.

      # Qwen3 Coder 480B (NVIDIA) removed 2026-07-25 and Qwen3.5 397B A17B
      # (NVIDIA) removed 2026-08-29 — the whole Qwen-on-NIM lineage is dead:
      #   qwen/qwen3-coder-480b-a35b-instruct  gone from GET /v1/models (2026-07)
      #   qwen/qwen3.5-397b-a17b               HTTP 410, EOL 2026-07-27
      # NIM now serves no `qwen/*` model at all (verified against the live
      # catalog, which returned zero ids under that prefix), so there is no
      # successor on this provider.
      #
      # Every Qwen-on-NVIDIA identifier was DELETED, not redirected: `qwen3.5`,
      # `qwen35`, `qwen35-nvidia`, `qwen-nvidia`, `qwen3-nvidia`,
      # `qwen-coder-nvidia`, plus the entry id. Note the deliberate choice for
      # the version-*neutral* `qwen-nvidia`/`qwen3-nvidia`/`qwen-coder-nvidia`,
      # which the removal convention would normally migrate: the only live Qwen
      # in this registry at the time was `qwen-next-bedrock`, and pointing a
      # `-nvidia` name at a **Bedrock** entry would silently move the user from
      # a free NIM endpoint to a billed one on a different provider. That is
      # exactly the "worse than an error a human reads and fixes" case, so they
      # fail fast. Later the same day `qwen-next-bedrock` was removed too, so
      # NO Qwen model remains anywhere in the registry - see the Qwen removal
      # note in the bedrock block. Every Qwen spelling now fails fast.

      # DeepSeek-V4-Pro-0813 (via NVIDIA) - DeepSeek AI
      # MoE: 1.65T total, 49B active parameters
      # Hybrid attention (CSA + HCA) + Manifold-Constrained
      # Hyper-Connections + attached DSpark speculative-decoding module
      # Best for: Long-context coding, agentic workflows
      #
      # 2026-08-29: re-pointed from `deepseek-ai/deepseek-v4-pro` (the
      #   preview), which NVIDIA end-of-lifed 2026-08-07 and which now
      #   answers HTTP 410 Gone — a dead endpoint, not merely superseded.
      #   `-0813` is DeepSeek's GA release of the same model line ("It
      #   supersedes the preview model" per the card), so this entry's id
      #   and aliases carry over unchanged rather than being migrated: the
      #   id is generation-neutral and the successor is a drop-in.
      #   Verified against GET /v1/models and a live completion.
      # Note: the card now names the reasoning levels low / high / max —
      #   the preview's Non-think / Think-High / Think-Max naming is gone.
      #   Non-thinking is the endpoint's default (verified live: no
      #   `reasoning_content` in the reply without a `reasoning_effort`),
      #   and `chat_template_kwargs.thinking: false` is still accepted, so
      #   it is kept below to state the intent rather than lean on a
      #   default. Non-think is also what keeps this entry on the tool-use
      #   path: a forced `tool_choice` returned a real `tool_calls` entry.
      - id: deepseek-v4-pro-nvidia
        full_id: deepseek-ai/deepseek-v4-pro-0813
        name: DeepSeek-V4-Pro-0813 (NVIDIA)
        # NVIDIA-suffixed aliases only — the bare names `deepseek-v4`,
        # `deepseek-v4-pro`, `dsv4` are now claimed by the direct DeepSeek
        # API provider (canonical owner of the model).
        aliases:
          - ds-v4-nvidia
          - dsv4-nvidia
          - deepseek-v4-nvidia
        pricing:
          # Free endpoint on build.nvidia.com
          input_per_million: 0.00
          output_per_million: 0.00
        inference_params:
          # NVIDIA model card evaluates -0813 at temp=1.0, top_p=0.95
          default_temperature: 1.0
          default_top_p: 0.95
          max_output_tokens: 16384
          # Non-think mode for deterministic code review
          # (reasoning_effort high/max would add reasoning overhead;
          # reviewer prompt is sufficiently constrained). Also what
          # keeps the forced tool_choice of the tool-use path working.
          thinking: false
        context_window: 1000000
        architecture: "MoE (1.65T total, 49B active)"
        capabilities:
          - code_review
          - code_generation
          - reasoning
          - agentic_tasks
          - tool_use
        notes: >-
          Official GA release superseding the V4-Pro preview.
          1M-token context, hybrid Compressed Sparse + Heavily
          Compressed Attention, Manifold-Constrained
          Hyper-Connections, DSpark speculative decoding,
          low/high/max reasoning effort. MIT-licensed.

      # DeepSeek-V4-Flash-0731 (via NVIDIA) - DeepSeek AI
      # MoE: 284B total, 13B active parameters, 1M token context
      # Best for: Fast, high-volume code review; cheap CI runs
      #
      # 2026-08-29: re-pointed from `deepseek-ai/deepseek-v4-flash`
      #   alongside the V4-Pro entry above — NVIDIA end-of-lifed the
      #   undated preview id on the same date (2026-08-07) and it answers
      #   HTTP 410 Gone. `-0731` is the live dated release; same drop-in
      #   reasoning, so id and aliases carry over unchanged.
      # Note: `thinking: false` below is LOAD-BEARING here, and this entry
      #   differs from V4-Pro-0813 on exactly this point. Verified live
      #   2026-08-29: Flash-0731 reasons *by default* (two probes returned
      #   `reasoning_content`, one burning the whole 400-token budget on
      #   reasoning and returning no content at all), whereas Pro-0813 does
      #   not. With `thinking: false` the reply carries no
      #   `reasoning_content` **and** a forced `tool_choice` comes back as a
      #   real `tool_calls` entry — which is what makes the tool-use path
      #   (no `supports_tool_use` override) correct for this entry. Remove
      #   the flag and this becomes a thinking model on the forced
      #   `tool_choice` path: the project's classic literal-text failure,
      #   with reasoning also eating the 16384-token output budget.
      - id: deepseek-v4-flash-nvidia
        full_id: deepseek-ai/deepseek-v4-flash-0731
        name: DeepSeek-V4-Flash-0731 (NVIDIA)
        # NVIDIA-suffixed aliases only — the bare names `deepseek-v4-flash`,
        # `dsv4-flash`, `dsv4f` are claimed by the direct DeepSeek API
        # provider (canonical owner of the model).
        aliases:
          - dsv4-flash-nvidia
          - ds-v4-flash-nvidia
        pricing:
          # Free endpoint on build.nvidia.com
          input_per_million: 0.00
          output_per_million: 0.00
        inference_params:
          # Mirror V4-Pro NVIDIA: model card evaluates at temp=1.0, top_p=0.95
          default_temperature: 1.0
          default_top_p: 0.95
          max_output_tokens: 16384
          # Required, not cosmetic — see the note above the entry: this is
          # what turns off Flash-0731's default-on reasoning, which in turn
          # is what keeps the forced tool_choice of the tool-use path
          # working and stops reasoning from consuming max_output_tokens.
          thinking: false
        context_window: 1000000
        architecture: "MoE (284B total, 13B active)"
        capabilities:
          - code_review
          - code_generation
          - reasoning
          - agentic_tasks
          - tool_use
        notes: >-
          1M-token context, fast/cheap sibling of V4-Pro-0813 for
          high-volume review and CI. MIT-licensed, low/high/max
          reasoning effort, native tool calling on NVIDIA NIM.

      # Kimi K3 (via NVIDIA) - Moonshot AI flagship
      # MoE: 2.8T total, 104B active, 896 experts (16 routed + 2 shared
      # per token); Kimi Delta Attention (69 KDA + 24 gated MLA layers),
      # Attention Residuals, Stable LatentMoE, 401M MoonViT-V2 vision
      # encoder. Quantization-aware trained (MXFP4 weights/MXFP8 acts).
      # Best for: long-horizon agentic coding, whole-repo review at 1M
      #   context, multimodal review (text + image in, text out)
      - id: kimi-k3-nvidia
        full_id: moonshotai/kimi-k3
        name: Kimi K3 (NVIDIA)
        # NVIDIA-suffixed aliases only — the bare `kimi-k3`/`kimi3` stay
        # reserved for the Moonshot direct provider, canonical owner of the
        # Kimi family (it currently ships K2.6). This is now the only Kimi on
        # NIM: the K2.6 re-host was removed 2026-08-29 (note below).
        aliases:
          - kimi-nvidia-3
          - kimi3-nvidia
        pricing:
          # Free/non-commercial NVIDIA NIM trial endpoint
          input_per_million: 0.00
          output_per_million: 0.00
        inference_params:
          # The model card's own evaluation config: temperature=1.0 with
          # top_p=0.95 for single-step tasks (its top_p=1.0 is for agentic
          # loops, which a one-shot review is not). Same fixed pair
          # Moonshot requires for K2.6.
          default_temperature: 1.0
          default_top_p: 0.95
          # Double the K2.6 sibling's 16384: thinking cannot be switched
          # off here and NIM bills reasoning inside completion_tokens, so
          # the report needs headroom above the reasoning it follows.
          max_output_tokens: 32768
        # Input Context Length (ISL) per the model card: 1,048,576
        context_window: 1048576
        # Thinking is ALWAYS enabled on K3 (model card, Output properties:
        # "Thinking is always enabled") with no knob to disable it — the
        # constant, not intermittent, forced-tool_choice-while-thinking
        # profile, same as Fable 5. Tool-use is unproven on
        # this endpoint (NIM's free tier rate-limited the probe), so the
        # assume-prompt-parsing rule applies; K2.6 on Moonshot-direct is
        # prompt-path for the same reason. Flip to true only if a live review
        # run proves tool-use while thinking.
        supports_tool_use: false
        architecture: "MoE (2.8T total, 104B active, 896 experts, multimodal)"
        capabilities:
          - code_review
          - code_generation
          - reasoning
          - agentic_tasks
          - thinking
          - multimodal
        notes: >-
          Native multimodal agentic model (text/image in, text out),
          1M-token context, always-on thinking with low/high/max effort
          levels. Modified MIT, commercial use allowed. Free NVIDIA NIM
          trial endpoint. Prompt-based JSON parsing.

      # Kimi K2.6 (NVIDIA) removed 2026-08-29 as CURATION - NOT because the
      # endpoint is dead, and this distinction matters for anyone re-adding it.
      # `moonshotai/kimi-k2.6` IS still listed by NIM's `GET /v1/models`; what it
      # returns for this account is HTTP 404 "Function ...: Not found for account
      # ...", i.e. account-scoped provisioning, not an EOL. That is a different
      # failure from the five entries removed the same day, which answered HTTP
      # 410 with NVIDIA's own EOL date. An account cleared for that function
      # would have had a working entry, which is why `moonshotai/kimi-k2.6` is
      # deliberately NOT in DEAD_UPSTREAM_FULL_IDS (tests/test_config.py).
      #
      # What made it expendable regardless: it is a re-host of a model the
      # registry already carries from its canonical owner (`kimi` on Moonshot
      # direct, same K2.6, same fixed temperature=1.0/top_p=0.95, same
      # prompt-parsing path), and the newer `kimi-k3-nvidia` above covers the
      # Kimi-on-NIM slot with a working endpoint and 4x the context.
      #
      # `kimi-nvidia-26`, `kimi26-nvidia` and the entry id `kimi-k2.6-nvidia`
      # were all DELETED - version-explicit, and the surviving NIM Kimi is a
      # different generation. Use `kimi-nvidia-3` (K3 on NIM) or `kimi`
      # (K2.6 on Moonshot direct). The K2.5-on-NIM names (kimi-k2.5,
      # kimi-k2.5-nvidia, kimi25) were already deleted on 2026-07-25 when NVIDIA
      # shut that endpoint down.

      # GLM-5.2 (NVIDIA) removed 2026-08-29: `z-ai/glm-5.2` is GONE from the
      # live NIM catalog and a completion answers HTTP 410 — NVIDIA end-of-lifed
      # it 2026-08-21. NIM now serves no `z-ai/*` model at all, closing out the
      # whole GLM-on-NVIDIA lineage (z-ai/glm5 deprecated 2026-04-20 ->
      # z-ai/glm-5.1 deprecated ~2026-07 -> z-ai/glm-5.2 EOL 2026-08-21).
      #
      # The NVIDIA-suffixed names were DELETED (`glm52` - the entry id - plus
      # `glm52-nvidia`, `glm5.2-nvidia`, `glm-5.2-nvidia`, `glm5-nvidia`):
      # nothing GLM-shaped is left on this provider to point them at.
      #
      # The version-neutral `glm5`/`glm-5` MIGRATED to `glm5-bedrock` instead of
      # being deleted, and note they land on the model they actually name: those
      # spellings say GLM *5*, and `zai.glm-5` on Bedrock is GLM 5 and is live in
      # the configured us-east-1 (verified against ListFoundationModels). That
      # is a provider *and* a billing change from the free NIM endpoint they used
      # to reach, which is why they stay `deprecated_aliases` — resolvable, but
      # not advertised by --list-models. For GLM-5.2 specifically use the Z.AI
      # direct entry (`glm` / `zhipuai/glm-5.2`), canonical owner of the family.

      # Step 3.5 Flash (NVIDIA) removed 2026-07-25 and Step 3.7 Flash (NVIDIA)
      # removed 2026-08-29 — no StepFun model remains on NIM:
      #   stepfun-ai/step-3.7-flash  HTTP 410, EOL 2026-08-28
      # The live catalog returns zero ids under the `stepfun` prefix, so 3.5 (an
      # endpoint that was merely superseded in July) is gone as well.
      #
      # Every Step identifier was DELETED, including the version-neutral
      # `step-flash` and `step-nvidia` that the removal convention would
      # normally migrate — there is no Step model anywhere in this registry to
      # migrate them onto. Also deleted: `step-3.7`, `step37`, `step37-nvidia`
      # and the entry id `step-3.7-flash`. Re-add from git history if NVIDIA
      # publishes a StepFun successor.

  # Google Generative AI Provider
  # Models via Google AI Studio / Gemini API
  google_genai:
    api_key: "${GOOGLE_API_KEY}"
    models:
      # Gemini 3.1 Pro Preview - Most advanced reasoning
      # 1M token context, Deep Think with 3 levels
      # 77.1% ARC-AGI-2, 94.3% GPQA Diamond
      - id: gemini-3.1-pro
        full_id: gemini-3.1-pro-preview
        name: Gemini 3.1 Pro Preview
        aliases:
          - gemini31-pro
          - gemini-pro
        # Back-compat only: resolves, but hidden from --list-models
        # (see --list-models --verbose).
        # Named Gemini 3 Pro, whose endpoint shut down 2026-03-09.
        deprecated_aliases:
          - gemini-3-pro
          - gemini3-pro
        pricing:
          input_per_million: 2.00
          output_per_million: 12.00
        inference_params:
          default_temperature: 0.1
          default_top_p: 0.95
          max_output_tokens: 65536
        context_window: 1000000
        capabilities:
          - code_review
          - reasoning
          - multimodal
          - tool_use
          - agentic_tasks
        notes: >-
          77.1% ARC-AGI-2, 94.3% GPQA Diamond,
          2x reasoning over Gemini 3 Pro,
          Deep Think with 3 levels

      # Gemini 3.7 Flash - latest Flash generation (August 2026)
      # 1M token context, 64K output, thinking at low/medium/high
      - id: gemini-3.7-flash
        full_id: gemini-3.7-flash
        name: Gemini 3.7 Flash
        # Generation-neutral `gemini-flash` tracks the current Flash
        # generation, so it moved here from gemini-3.6-flash.
        aliases:
          - gemini-flash
          - gemini37-flash
          - gemini3.7-flash
        # Back-compat only: resolves, but hidden from --list-models
        # (see --list-models --verbose).
        # Inherited 2026-08-29 from the removed Gemini 3.6 Flash entry, which had
        # in turn absorbed them from Gemini 3 Flash Preview (2026-07-25). They
        # state generation *3*, and 3.7 Flash is a generation-3 Flash at the same
        # $1.50/$7.50, same 1M context and same 64K output - so unlike a
        # `sonnet4.6`-style name, following them forward doesn't change what the
        # name claims. Deprecated rather than advertised because two of the three
        # were minted for a model two releases back.
        deprecated_aliases:
          - gemini-3-flash
          - gemini3-flash
          - g3flash
        pricing:
          # Verified: ai.google.dev/gemini-api/docs/pricing (2026-08-17).
          # Same standard rate as 3.6 Flash. Google is running an introductory
          # discount - $0.75/$3.75 through 2026-12-31, reverting to
          # $1.50/$7.50 on 2027-01-01 - and the standard rate is what's
          # recorded, matching the 3.6 entry. Estimates therefore over-state
          # cost during the promo rather than under-stating it after it ends.
          input_per_million: 1.50
          output_per_million: 7.50
        inference_params:
          # temperature/top_p/top_k are DEPRECATED from Gemini 3.6 Flash onward:
          # the API ignores them today and Google documents an HTTP 400 for
          # future model generations, so all three are omitted deliberately.
          # The Google provider passes allow_none=True to _resolve_temperature,
          # so an absent default_temperature means no temperature is sent at
          # all. This applies to EVERY Gemini entry added from here on (3.1 Pro
          # predates the deprecation and keeps its own).
          max_output_tokens: 65536
        context_window: 1000000
        capabilities:
          - code_review
          - reasoning
          - multimodal
          - tool_use
          - agentic_tasks
          - computer_use
          - thinking
        notes: >-
          Latest and most capable Flash model (August 2026), built for complex
          coding, agentic workflows and reliable multi-step execution. 1M-token
          context (1,048,576), up to 64K output. Thinking supported at low,
          medium and high; "minimal" is rejected with an error. Sampling params
          (temperature/top_p/top_k) are deprecated and omitted. Keeps the
          tool-use path (no supports_tool_use override): the model card lists
          Structured outputs and Function calling as Supported, and three live
          runs on 2026-08-17 each returned a valid CodeReviewReport with
          parsing_error None - each with output_token_details.reasoning > 0, so
          thinking was active on the runs that succeeded, which is the
          condition the assume-prompt-parsing rule exists for.

      # Gemini 3 Flash Preview removed 2026-07-25 and Gemini 3.6 Flash removed
      # 2026-08-29 - gemini-3.7-flash above is the only Flash entry left:
      #   gemini-3-flash-preview  DEPRECATED upstream (announced 2025-12-17),
      #     with gemini-3.6-flash named as its replacement. Still live on the
      #     API; re-add from git history for the cheaper $0.50/$3.00 rate.
      #   gemini-3.6-flash        still live, removed as CURATION: 3.7 Flash
      #     supersedes it at the IDENTICAL $1.50/$7.50, identical 1M context and
      #     identical 64K output cap, on the same tool-use structured-output
      #     path, so the entry was a strict duplicate of a newer sibling.
      #
      # Alias disposition: the generation-3 names `gemini-3-flash`,
      # `gemini3-flash` and `g3flash` MIGRATED onto gemini-3.7-flash as
      # deprecated_aliases - 3.7 is a generation-3 Flash at the same price and
      # limits, so the names stay truthful (this is the `glm5` case, not the
      # `sonnet4.6` case). The version-explicit `gemini36-flash`,
      # `gemini3.6-flash` and the entry id `gemini-3.6-flash` were DELETED: a
      # name that pins the minor version must not answer from a different one.

  # DeepSeek Direct API Provider
  # Uses langchain-deepseek's ChatDeepSeek (purpose-built single-purpose
  # package, not the heavy langchain-community).
  # OpenAI-format compatible at https://api.deepseek.com.
  # Both V4-Pro and V4-Flash support tool calling and structured output
  # natively (unlike DeepSeek-V4-Pro on Azure Foundry, which requires
  # prompt-based JSON parsing because SGLang doesn't expose tools).
  deepseek:
    api_key: "${DEEPSEEK_API_KEY}"
    api_base: "https://api.deepseek.com"
    request_timeout: 300
    models:
      # DeepSeek V4 Pro - flagship reasoning + agentic model
      # 1M context, 384K max output, three reasoning modes
      - id: deepseek-v4-pro
        full_id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        aliases:
          - dsv4-pro
          - ds-v4-pro
        # Back-compat only: resolves, but hidden from --list-models
        # (see --list-models --verbose).
        # Absorbed from the removed DeepSeek-V4-Pro (Azure) entry, whose Foundry
        # deployment is gone (2026-07-25). DeepSeek direct is the canonical
        # owner of this family, so no -azure name is advertised.
        deprecated_aliases:
          - deepseek-v4-pro-azure
          - deepseek-v4-azure
          - ds-v4-azure
        pricing:
          # DeepSeek list price (https://api-docs.deepseek.com/quick_start/pricing).
          # Per DeepSeek docs, the 75% launch promo ends 2026-05-31 15:59 UTC,
          # after which the steady-state rate is 1/4 of the original list
          # ($1.74/$3.48) → $0.435/$0.87. Values below reflect that post-promo
          # steady-state rate.
          input_per_million: 0.435
          output_per_million: 0.87
        inference_params:
          # Lower temp for code review determinism (model default 1.0)
          default_temperature: 0.3
          default_top_p: 0.95
          max_output_tokens: 16384
        context_window: 1000000
        capabilities:
          - reasoning
          - code_review
          - code_generation
          - structured_output
          - tool_use
          - thinking
        notes: >-
          Flagship V4 model: chain-of-thought reasoning, JSON mode,
          tool calling, 1M context. Direct API supports thinking mode
          toggle (unlike Azure Foundry deployment).

      # DeepSeek V4 Flash - cost-efficient instant model
      # Same 1M context, much cheaper, faster
      - id: deepseek-v4-flash
        full_id: deepseek-v4-flash
        name: DeepSeek-V4-Flash
        aliases:
          - dsv4-flash
          - ds-v4-flash
        pricing:
          input_per_million: 0.14
          output_per_million: 0.28
        inference_params:
          default_temperature: 0.3
          default_top_p: 0.95
          max_output_tokens: 16384
        context_window: 1000000
        capabilities:
          - code_review
          - code_generation
          - structured_output
          - tool_use
        notes: >-
          Cost-efficient flash variant. 12x cheaper input than V4-Pro,
          same context window. Best for high-volume reviews and CI.

  # Moonshot AI (Kimi) Direct API Provider
  # Uses langchain-moonshot's ChatMoonshot, which extends BaseChatOpenAI
  # and handles Kimi-specific parameter constraints (kimi-k2.5 thinking
  # mode requires temperature=1.0 / top_p=0.95; kimi-k2.6 server-side
  # rejects `tool_choice='specified'` while thinking is enabled, so we
  # route k2.6 through prompt-based JSON parsing — see supports_tool_use
  # below).
  #
  # Two separate platforms with separate accounts/keys:
  #   - .cn (Chinese): https://api.moonshot.cn/v1   (platform.moonshot.cn)
  #   - .ai (international): https://api.moonshot.ai/v1  (platform.moonshot.ai)
  # KIMI_API_KEY usually maps to the .cn console. Override base_url here
  # if your key is from platform.moonshot.ai instead.
  moonshot:
    api_key: "${KIMI_API_KEY}"
    base_url: "https://api.moonshot.cn/v1"
    request_timeout: 300
    models:
      # Kimi K2.6 - flagship long-horizon agentic coding model
      # 1T MoE, 32B active, 384 experts, 256K context
      - id: kimi-k2.6
        full_id: kimi-k2.6
        name: Kimi K2.6 (Moonshot)
        aliases:
          - kimi
          - kimi26
        # Back-compat only: resolves, but hidden from --list-models
        # (see --list-models --verbose).
        # Absorbed from the removed Kimi K2.5 (Azure) entry, whose Foundry
        # deployment is gone (2026-07-25), and from the removed Kimi K2.5
        # (Bedrock) entry (2026-08-29 - see the removal note in the bedrock
        # block). Both are version-neutral names for the Kimi family whose
        # provider suffix no longer holds; this entry is the family's canonical
        # owner, so it inherits them unadvertised.
        deprecated_aliases:
          - kimi-k2.5-azure
          - kimi-azure
          - kimi25-azure
          - kimi-bedrock
        pricing:
          # Moonshot list price (https://platform.moonshot.ai/pricing)
          # Update if upstream changes; treat as a starting estimate
          # since the docs page wasn't directly fetchable at config time.
          input_per_million: 0.60
          output_per_million: 2.50
        inference_params:
          # Moonshot's K2.6 server-side enforces temperature=1.0 and
          # top_p=0.95 (same constraint as K2.5 with thinking enabled).
          # Sending any other value yields HTTP 400:
          #   "invalid temperature: only 1 is allowed for this model".
          # K2.6 is trained for sufficient determinism at fixed t=1.0;
          # do NOT lower for code review here.
          default_temperature: 1.0
          default_top_p: 0.95
          max_output_tokens: 16384
        context_window: 262144
        # Moonshot's server rejects `tool_choice='specified'` while
        # K2.6's implicit thinking mode is enabled (HTTP 400:
        # "tool_choice 'specified' is incompatible with thinking
        # enabled"). `.with_structured_output()` would set exactly
        # that tool_choice under the hood, so we route K2.6 through
        # prompt-based JSON parsing instead — same pattern as MiniMax
        # M2.5 on Bedrock and DeepSeek-V4-Pro on Azure.
        supports_tool_use: false
        architecture: "MoE (1T total, 32B active, 384 experts)"
        capabilities:
          - reasoning
          - code_review
          - code_generation
          - long_horizon_agentic
          - structured_output
          - thinking
        notes: >-
          Long-horizon agentic coding with thinking mode. Tool use
          conflicts with thinking on Moonshot's server, so structured
          output is produced via prompt-based JSON parsing
          (PydanticOutputParser) — see supports_tool_use above.

  # Z.AI (Zhipu International) Provider
  # OpenAI-compatible endpoint at https://api.z.ai/api/paas/v4/
  # Models exposed via langchain-openai's ChatOpenAI with custom base_url
  # — no langchain-community dependency.
  zai:
    api_key: "${ZAI_API_KEY}"
    base_url: "https://api.z.ai/api/paas/v4/"
    request_timeout: 300
    models:
      # GLM-5.2 (Z.AI) — current Zhipu flagship, supersedes GLM-5.1.
      # Long-horizon engineering model: "truly usable 1M-token context" for
      # project-scale coding/refactoring, more stable long-task execution, and
      # tighter adherence to engineering standards. Thinking/reasoning mode +
      # function calling + MCP. https://docs.z.ai/guides/llm/glm-5.2
      - id: zhipuai/glm-5.2
        full_id: glm-5.2
        name: GLM-5.2 (Z.AI)
        aliases:
          - glm
          - glm-5.2
          - glm5.2
          - glm5.2-zai
          - zai-glm
          - glm-zai
        # 2026-07-25: the GLM-5.1 back-compat names (zhipuai/glm-5.1 - the
        # removed entry's id - and glm5.1-zai) were deleted, not migrated.
        # Use `glm` (generation-neutral) or `glm-5.2`.
        pricing:
          # Official docs.z.ai pricing page: $1.40 / $4.40 per 1M tokens
          # (same list price as GLM-5.1).
          input_per_million: 1.40
          output_per_million: 4.40
        inference_params:
          # GLM-5.2 is a thinking model. The vendor's examples pair thinking
          # with temperature 1.0 (non-streaming) / 0.6 (streaming). For
          # deterministic code review we take the LOWER documented value (0.6):
          # it curbs variance/hallucinated line numbers without starving the
          # reasoning pass — pushing lower (<=0.3) tends to destabilize thinking
          # models. top_p matches the model card. NOTE: thinking is governed
          # server-side on Z.AI's OpenAI-compat endpoint; ZAIProvider does not
          # forward enable_thinking/reasoning_effort, so they're omitted here.
          default_temperature: 0.6
          default_top_p: 0.95
          max_output_tokens: 16384
        # Docs: "truly usable 1M-token context" (1024*1024 tokens).
        context_window: 1048576
        # Same path the retired GLM-5.1 entry used: Z.AI's OpenAI-compat
        # endpoint ignores the json_schema response_format that
        # .with_structured_output() sets and returns markdown-fenced JSON,
        # which the json_schema parser rejects with
        # "Invalid JSON: expected value at line 1 column 1". GLM-5.2 is
        # additionally a thinking model, so per the "assume prompt-parsing until
        # a live run proves tool-use" rule it stays on the PydanticOutputParser
        # path regardless. (PydanticOutputParser strips the ```json fences.)
        supports_tool_use: false
        capabilities:
          - reasoning
          - code_review
          - code_generation
          - long_horizon_agentic
          - tool_use
          - structured_output
        notes: >-
          Current Zhipu flagship (supersedes GLM-5.1). 1M-token context for
          project-scale coding, stable long-horizon execution, thinking mode.
          OpenAI-compatible endpoint; structured output via prompt-based JSON
          parsing (supports_tool_use: false) — Z.AI returns markdown-fenced JSON.

      # GLM-5.1 (Z.AI) removed 2026-07-25: superseded by GLM-5.2 above at the
      # SAME $1.40/$4.40 list price, with a 1M context instead of 203K — no
      # reason to pick 5.1. Still live on Z.AI, so re-add from git history if
      # needed. GLM-5.2 absorbed its aliases.

  # OpenAI-on-Bedrock Provider (OpenAI-compatible endpoint)
  # AWS hosts OpenAI's frontier models (GPT-5.6 Sol here) and xAI's Grok on
  # Amazon Bedrock through this surface. The provider is named for OpenAI but is
  # NOT OpenAI-only — Grok rode the same endpoint until 2026-08-29, so a
  # non-OpenAI vendor arriving on bedrock-mantle belongs here, not in a new
  # provider.
  # This is a DIFFERENT path from the SigV4-based "bedrock" provider
  # above: the OpenAI-compatible surface authenticates with an Amazon Bedrock
  # API KEY (a bearer token, NOT AWS creds) and is driven with langchain-openai's
  # ChatOpenAI + custom base_url — same mechanism as the Z.AI provider.
  #
  #   OPENAI_API_KEY        → the Amazon Bedrock API key (generate in the
  #                           Bedrock console; this is NOT an openai.com key)
  #   OPENAI_BASE_URL       → your region's Bedrock OpenAI endpoint
  #   BEDROCK_OPENAI_MODEL_ID → paste into each model's `full_id` below
  #
  # No new dependency: langchain-openai (already required) pulls the `openai`
  # SDK, which reads OPENAI_API_KEY/OPENAI_BASE_URL natively.
  #
  # full_id holds the wire-level model id. It is a LITERAL here (not
  # ${BEDROCK_OPENAI_MODEL_ID}) because an unset env var would expand to "" and
  # fail full_id's min_length validation, breaking --list-models. Replace the
  # placeholders below with the exact model IDs from your Bedrock console.
  bedrock_openai:
    api_key: "${OPENAI_API_KEY}"
    base_url: "${OPENAI_BASE_URL}"
    request_timeout: 300
    models:
      # GPT-5.4 (Bedrock) removed 2026-07-25 and GPT-5.5 (Bedrock) removed
      # 2026-08-29 - gpt5.6-sol-bedrock below is the only OpenAI entry left on
      # this endpoint. Both are still LIVE on bedrock-mantle (5.4 probed HTTP
      # 200 on 2026-07-25; 5.5 probed HTTP 200 on the us-east-2 mantle base on
      # 2026-08-29), so both removals were CURATION - re-add from git history if
      # a generation comparison is wanted.
      #   openai.gpt-5.4  superseded at identical $2.50/$15 by 5.5.
      #   openai.gpt-5.5  superseded by GPT-5.6 Sol, which is OpenAI's best
      #     coding model to date. Two things you give up, recorded because the
      #     successor is not a free upgrade: Sol costs 2x ($5/$30 vs $2.50/$15),
      #     and 5.5 had the wider context window (400K vs Sol's 272K). If
      #     per-token cost matters more than coding rank, the GPT-5.6 Terra
      #     ($2.50/$15) and Luna ($1/$6) tiers are the intended replacements -
      #     add them the way the Sol entry below is written.
      # NOTE: GPT-5.4 on *Azure* is a separate entry and stays - that's a
      # user-created deployment, and it's the newest GPT on that resource.
      #
      # Alias disposition: the generation-neutral `gpt-bedrock` MIGRATED to
      # gpt5.6-sol-bedrock, as a deprecated_alias - it names "the GPT on
      # Bedrock", which Sol now is. It stays unadvertised BECAUSE OF THE PRICE:
      # following the name forward doubles the per-token rate, and a name that
      # silently costs 2x should not be in the advertised list. The
      # version-explicit ids `gpt5.5-bedrock` and `gpt5.4-bedrock` were DELETED.
      #
      # Evidence worth keeping from the 5.5 entry: its supports_tool_use: false
      # was VERIFIED against the live endpoint, not assumed. GPT-5.5 engaged
      # server-side reasoning per request (adaptive), and on batches where it
      # thought it returned ONLY a reasoning block with tool_calls=[] and no
      # `parsed` field, so the forced tool_choice that .with_structured_output()
      # sets had nothing to parse ("Structured Output response does not have a
      # 'parsed' field"). Intermittent - it failed exactly on the think-heavy
      # batches. That observation is the basis for the Sol entry's flag below.

      # GPT-5.6 Sol — OpenAI's flagship of the GPT-5.6 family (Sol/Terra/Luna),
      # GA on Amazon Bedrock (launched 2026-07-13) via the OpenAI-compatible
      # `bedrock-mantle` endpoint, and after the 2026-08-29 pass the ONLY entry
      # left on it. We pick the Sol tier because it is OpenAI's best coding model
      # to date (SOTA on the Artificial Analysis Coding Agent Index,
      # Terminal-Bench 2.1, and DeepSWE) — the right match for code review. Terra
      # ($2.50/$15) and Luna ($1/$6) are the cheaper balanced / high-volume tiers
      # (ids openai.gpt-5.6-terra / openai.gpt-5.6-luna) — add them the same way
      # if a cheaper run is wanted; they are also what replaces the removed
      # GPT-5.5 entry on price rather than on capability.
      #
      # Reasoning model: the model card lists ONLY the Responses endpoint (Chat
      # Completions, Converse, and bedrock-runtime are all NOT supported), so
      # use_responses_api: true is REQUIRED here. Rejects temperature/top_p like
      # the rest of the GPT-5.x family. In-Region only: us-east-1 / us-east-2
      # (NOT us-west-2) — pin OPENAI_BASE_URL to one of those.
      - id: gpt5.6-sol-bedrock
        full_id: openai.gpt-5.6-sol
        name: GPT-5.6 Sol (Bedrock)
        aliases:
          - gpt5.6
          - gpt-5.6
          - gpt5.6-bedrock
        # Back-compat only: resolves, but hidden from --list-models
        # (see --list-models --verbose).
        # Inherited 2026-08-29 from the removed GPT-5.5 (Bedrock) entry. Kept
        # unadvertised because following it forward DOUBLES the per-token rate
        # ($2.50/$15 -> $5/$30) and narrows the context window (400K -> 272K);
        # see the removal note above.
        deprecated_aliases:
          - gpt-bedrock
        pricing:
          # OpenAI list price for Sol (per the GPT-5.6 launch): $5 in / $30 out
          # per 1M. Cache reads get the 90% discount ($0.50); cache writes bill
          # at 1.25x input. Only input/output are read by the bedrock_openai
          # pricing path (extra keys ignored).
          input_per_million: 5.00
          output_per_million: 30.00
        inference_params:
          # No default_temperature/top_p — GPT-5.6 reasoning models reject them
          # (as did GPT-5.5/5.4 on this endpoint). Reasoning effort defaults
          # server-side; left unset so operators can tune per request.
          max_output_tokens: 128000
        use_responses_api: true
        # Model card: 272K-token context window.
        context_window: 272000
        # Adaptive server-side reasoning, same as GPT-5.5/5.4 had on this
        # endpoint: think-heavy batches return a reasoning-only response
        # (tool_calls=[], no `parsed`), which breaks the forced tool_choice that
        # .with_structured_output() sets ("no 'parsed' field"). Route through
        # prompt-based JSON parsing. The GPT-5.5 behavior this rests on was
        # verified live before that entry was removed — the evidence is preserved
        # in the removal note above, not just in git history.
        supports_tool_use: false
        capabilities:
          - reasoning
          - code_review
          - code_generation
          - security_analysis
          - structured_output
        notes: >-
          OpenAI GPT-5.6 Sol (flagship of the Sol/Terra/Luna family) hosted on
          Amazon Bedrock via the OpenAI-compatible bedrock-mantle endpoint
          (bearer-key auth, ChatOpenAI + base_url — NOT the SigV4 Converse path).
          Best-in-class coding/agentic reasoning, 272K context. Responses API
          only (no Chat Completions), no temperature/top_p. Structured output via
          prompt-based JSON parsing (supports_tool_use: false) — the same
          reasoning-only failure mode verified on GPT-5.5 on Bedrock. In-Region
          only: us-east-1 / us-east-2.

      # Grok 4.3 (Bedrock) removed 2026-08-29, and with it xAI leaves this
      # registry entirely — there is no other Grok entry on any provider.
      # `xai.grok-4.3` is still LIVE on bedrock-mantle, so this was CURATION, and
      # it is the removal in this pass that costs the most, so read this before
      # deciding not to re-add it:
      #   - It was the CHEAPEST entry on bedrock_openai by a wide margin
      #     ($1.25/$2.50 against GPT-5.6 Sol's $5/$30 — 12x on output). This
      #     provider now starts at $5/$30.
      #   - It had the widest context here (1M vs Sol's 272K).
      #   - It was the ONLY entry on this provider that ACCEPTED temperature/top_p
      #     (card defaults 0.7/0.95; we sent 0.3 for deterministic review) and so
      #     the only one on plain Chat Completions rather than the Responses API —
      #     which made it the reference case for `use_responses_api` being
      #     optional on bedrock-mantle rather than implied by it.
      # Re-add from git history if a cheap wide-context reviewer is wanted; the
      # cheaper GPT-5.6 Terra/Luna tiers are the in-family alternative, but they
      # are Responses-only reasoning models and reject sampling params.
      #
      # Every Grok identifier was DELETED, including the version-neutral `grok`
      # and `grok-bedrock` that the convention would normally migrate: no xAI
      # model remains to migrate them onto, so the family fails fast rather than
      # answering from OpenAI (same reasoning as `step-flash` and `qwen`). Also
      # deleted: `grok-4.3`, `grok43` and the entry id `grok-4.3-bedrock`.

# Default model configuration
defaults:
  bedrock_default: opus5
  azure_default: gpt-5.4
  # Updated 2026-08-29: was mistral-medium-nvidia, whose endpoint NVIDIA EOL'd.
  nvidia_default: deepseek-v4-flash-nvidia
  zai_default: zhipuai/glm-5.2
  deepseek_default: deepseek-v4-pro
  moonshot_default: kimi-k2.6
  aws_region: us-west-2
  max_tokens: 16000

# File scanning configuration
scanning:
  max_file_size_kb: 500
  warn_file_size_kb: 100
  exclude_patterns:
    # Dependency directories
    - "**/node_modules/**"
    - "**/.venv/**"
    - "**/venv/**"
    - "**/vendor/**"
    # Build outputs
    - "**/dist/**"
    - "**/build/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/*.pyo"
    # Version control
    - "**/.git/**"
    - "**/.svn/**"
    # IDE and editors
    - "**/.vscode/**"
    - "**/.idea/**"
    - "**/*.swp"
    # Test fixtures and generated code
    - "**/test_data/**"
    - "**/fixtures/**"
    - "**/*_pb2.py"
    - "**/*_pb2_grpc.py"
    # Common non-review files
    - "**/*.min.js"
    - "**/*.min.css"
    - "**/migrations/**"
    - "**/*.lock"
  exclude_extensions:
    - ".json"
    - ".yaml"
    - ".yml"
    - ".toml"
    - ".md"
    - ".txt"
    - ".rst"
    - ".jpg"
    - ".png"
    - ".gif"
    - ".svg"
    - ".bin"
    - ".exe"
    - ".so"
    - ".dylib"
    - ".pyc"
    - ".pyo"

# Code Review Recommendations
#
# For accurate, deterministic code review:
# - Use temperature 0.0-0.3 (lower = consistent)
# - Use top_p 0.8-0.95 for controlled output
# - Prefer models with strong SWE-bench scores
#
# Model selection by use case. Prices are input/output per million tokens and
# WILL drift — `codereview --list-models` prints them from the entries below and
# is the authoritative view. Every figure that used to be quoted here had gone
# stale, and one named a model that no longer exists at all.
# - Free: any NVIDIA NIM entry (free tier; $0/$0 above)
# - Quick: Haiku 4.5 (the only sub-$3 Bedrock entry after the 2026-08-29 pass)
# - Standard: Sonnet 5, Gemini 3.7 Flash, GLM-5.2 (Z.AI)
# - Complex: Opus 5 (the CLI default), GPT-5.6 Sol (Bedrock)
# - Budget-with-a-key: DeepSeek-V4-Flash, Kimi K2.6 (Moonshot)
