# Model Configuration for Code Review Tool
# This file defines all available AI models
# for code review analysis
#
# Pricing/parameters researched: January 2026
# Sources: AWS Bedrock, Azure OpenAI,
#   Anthropic, Moonshot, Alibaba, Zhipu

---
version: "1.1"

providers:
  # AWS Bedrock Provider
  bedrock:
    region: us-east-1
    models:
      # Claude Models (Anthropic)
      # Best for: Code review, reasoning, security
      - id: fable5
        full_id: us.anthropic.claude-fable-5
        name: Claude Fable 5
        # Geo-US profile is us-east-1 only, and the provider_data_share
        # data-retention opt-in it requires is per-region account state -
        # invoking from the provider default (us-west-2) fails with
        # "data retention mode 'default' is not available for this model".
        region: us-east-1
        # Adaptive thinking is always on and the Converse call is
        # non-streaming, so no bytes arrive until the full response is
        # generated - think-heavy batches outlast the provider-default
        # read_timeout (300s); observed ReadTimeoutError at 5+ minutes.
        read_timeout: 1800
        aliases:
          - claude-fable-5
          - fable-5
          - fable
        pricing:
          input_per_million: 10.00
          output_per_million: 50.00
        inference_params:
          # Fable 5 requires temperature to be 1.0-or-unset, top_p to be
          # >=0.99-or-unset, and rejects top_k entirely (Bedrock model card,
          # June 2026) - omit all sampling params
          max_output_tokens: 128000
        context_window: 1000000
        # Adaptive thinking is always on and cannot be disabled (Bedrock model
        # card), so it should reproduce the forced-tool_choice-while-thinking
        # failure constantly rather than intermittently - see the opus5 entry
        # below for what was observed on that path (a tool call returned as
        # literal text, so CodeReviewReport.issues fails with a list_type
        # error). Unverified live on this model: assume-prompt-parsing rule.
        # Note Anthropic documents forced tool use as SUPPORTED with adaptive
        # thinking (the auto/none-only rule is specific to manual
        # thinking.type: "enabled"), so the cause is not a documented API
        # restriction; the empirical failure is what drives this flag.
        # Route structured output through prompt-based JSON parsing.
        supports_tool_use: false
        capabilities:
          - code_review
          - security_analysis
          - reasoning
          - vision
          - adaptive_thinking
        notes: >-
          Mythos-class flagship (June 2026) for complex knowledge work and
          coding. 1M-token context, up to 128K output. Adaptive thinking is
          always on - temperature/top_p/top_k not configurable, and structured
          output uses prompt-based JSON parsing (supports_tool_use: false).
          Requires a one-time account opt-in to provider data sharing
          (Data Retention API, mode=provider_data_share) before invocation.
          Dual-use prompts fall back to Opus 4.8 server-side and are billed
          at Opus rates. Geo-US inference profile; in-region us-east-1 only.

      - id: opus5
        full_id: us.anthropic.claude-opus-5
        name: Claude Opus 5
        # Thinking is ON by default (breaking change from Opus 4.8, where it
        # was off unless requested) at default effort "high", and the Converse
        # call is non-streaming - so no bytes arrive until the full response is
        # generated. Same condition that forced Fable 5's override; think-heavy
        # batches outlast the provider-default read_timeout (300s).
        read_timeout: 1800
        # Generation-neutral aliases track the current generation, so `opus`
        # and `claude-opus` point here. This entry also absorbed the
        # version-explicit aliases of the removed Opus 4.7 / 4.6 entries
        # (2026-07-25) so existing --model invocations keep resolving.
        aliases:
          - opus
          - claude-opus
          - claude-opus-5
          - opus-5
          - claude-opus5
        # 2026-07-25: the Opus 4.7 / 4.6 back-compat aliases (opus4.7,
        # opus-4.7, claude-opus-4.7, claude-opus-47, opus4.6, opus-4.6,
        # claude-opus-4.6) were deleted, not migrated - `--model opus4.6` now
        # fails fast rather than silently resolving to a two-generations-newer
        # model. Use `opus` (generation-neutral) or `opus5`.
        pricing:
          # Verified: AWS Bedrock model card / Anthropic pricing (July 2026).
          # Unchanged from Opus 4.8.
          input_per_million: 5.00
          output_per_million: 25.00
        inference_params:
          # Reasoning model - temperature/top_p/top_k not supported.
          # default_temperature omitted intentionally.
          max_output_tokens: 128000
        context_window: 1000000
        # Unlike the other adaptive-thinking Claude entries, this one is not an
        # assume-prompt-parsing guess: the Bedrock model card lists "Structured
        # outputs: Not Supported" for both the bedrock-runtime and
        # bedrock-mantle endpoints. Thinking-on-by-default also reproduces the
        # Opus 4.8 failure: .with_structured_output() forces a tool_choice, the
        # tool call comes back as literal text, and CodeReviewReport.issues
        # fails with a list_type error. That failure is observed, not a
        # documented API restriction - Anthropic states forced tool use IS
        # supported with adaptive thinking, and only manual
        # thinking.type: "enabled" is limited to auto/none.
        # Route through prompt-based JSON parsing.
        supports_tool_use: false
        capabilities:
          - code_review
          - security_analysis
          - reasoning
          - computer_use
          - adaptive_thinking
          - vision
        notes: >-
          Most capable Opus model (July 2026) and first of the Claude 5
          generation's Opus tier; step-change gains in deep reasoning,
          agentic/long-horizon coding, and code review and bug-finding at
          Opus 4.8 pricing. 1M-token context (default and maximum), up to 128K
          output. Thinking is on by default - effort (low/medium/high/xhigh/max,
          default high) is the control for depth, and disabling thinking is
          rejected above high effort. Structured output uses prompt-based JSON
          parsing (supports_tool_use: false). Zero data retention on by default,
          so no provider_data_share opt-in (unlike Fable 5). Geo-US inference
          profile; In-Region us-east-1, Geo/Global route more broadly.

      # Opus 4.7 and Opus 4.6 removed 2026-07-25, Opus 4.8 removed 2026-08-29:
      # the whole pre-5 Opus tier is gone. 4.7/4.6 were superseded by
      # opus4.8/opus5 at identical $5/$25 pricing (4.6 also had only a 200K
      # context); 4.8 was superseded by opus5 at the same $5/$25, same 1M
      # context and same 128K output, so it added no capability and no cheaper
      # tier — it was cut as CURATION, not because it died. `us.anthropic.
      # claude-opus-4-8` is still ACTIVE on Bedrock (verified against
      # ListFoundationModels 2026-08-29), so re-add from git history if a
      # specific 4.8-vs-5 comparison is ever needed. Every 4.8 identifier was
      # DELETED, not migrated — the entry id `opus4.8` plus `claude-opus-4.8`,
      # `opus-4.8` and `claude-opus-48` all state a version, and `opus`/
      # `claude-opus` were already on opus5.

      - id: sonnet5
        full_id: us.anthropic.claude-sonnet-5
        name: Claude Sonnet 5
        # Generation-neutral `sonnet`/`claude-sonnet` moved here 2026-08-29 when
        # the Sonnet 4.6 entry was removed - see the removal note below. They are
        # `aliases`, not `deprecated_aliases`: this IS the current Sonnet, so the
        # names stay truthful and advertisable.
        aliases:
          - sonnet
          - claude-sonnet
          - claude-sonnet-5
          - sonnet-5
          - claude-sonnet5
        pricing:
          # Standard rates ($3/$15). A launch promo of $2/$10 runs through
          # 2026-08-31 on both Bedrock and Anthropic; we register the durable
          # standard price so cost previews don't silently under-report once
          # the promo lapses (unchanged from Sonnet 4.6's rates).
          input_per_million: 3.00
          output_per_million: 15.00
        inference_params:
          # Sonnet 5 rejects temperature/top_p/top_k with a 400 (same
          # constraint as Opus 5 and Fable 5) - omit all sampling params.
          # default_temperature omitted intentionally.
          max_output_tokens: 128000
        context_window: 1000000
        # First Sonnet-tier model with adaptive thinking on by default, engaged
        # server-side per request. Anthropic forbids a forced tool_choice while
        # thinking is active (only "auto"/"none" allowed), but
        # .with_structured_output() sets exactly that forced tool_choice - so on
        # batches where the model thinks, the tool call comes back as literal
        # text and CodeReviewReport.issues fails with a list_type error. Same
        # incompatibility as Opus 5. Route through prompt-based JSON
        # parsing instead.
        supports_tool_use: false
        capabilities:
          - code_review
          - coding
          - agents
          - computer_use
          - reasoning
          - adaptive_thinking
          - vision
        notes: >-
          Latest Sonnet model (June 2026), first of the Claude 5 generation's
          Sonnet tier. Near-Opus intelligence at Sonnet pricing. 1M-token
          context, up to 128K output. Adaptive thinking on by default; rejects
          temperature/top_p/top_k, and structured output uses prompt-based JSON
          parsing (supports_tool_use: false), same as Opus 5. Uses an
          updated tokenizer (~1.0-1.35x more tokens than Sonnet 4.6). Ships with
          real-time cybersecurity safeguards (same as Opus 5). Geo-US
          inference profile; routes us-east-1/us-east-2/us-west-2.

      # Sonnet 4.6 removed 2026-08-29: superseded by sonnet5 above at the SAME
      # $3/$15, with 5x the context (1M vs 200K) and double the output cap
      # (128K vs 64K), so the older entry bought nothing. Cut as CURATION -
      # `global.anthropic.claude-sonnet-4-6` is still ACTIVE on Bedrock
      # (ListFoundationModels, 2026-08-29), so re-add from git history if a
      # 4.6-vs-5 comparison is wanted. Note what re-adding costs you: 4.6 was
      # the last Sonnet-tier entry that ACCEPTED temperature (0.1) and used the
      # tool-use structured-output path, both of which Sonnet 5 gives up.
      #
      # Alias disposition: the generation-neutral `sonnet` (the removed entry's
      # id) and `claude-sonnet` MIGRATED up to sonnet5, as `aliases` - they name
      # the Sonnet tier, not a version, and sonnet5 is that tier now. The
      # version-explicit `sonnet4.6` and `claude-sonnet-4.6` were DELETED, so
      # `--model sonnet4.6` fails fast instead of quietly answering from a
      # different generation with different sampling-param and structured-output
      # behavior.

      - id: haiku
        full_id: >-
          global.anthropic.claude-haiku-4-5-20251001-v1:0
        name: Claude Haiku 4.5
        aliases:
          - claude-haiku
        pricing:
          input_per_million: 1.00
          output_per_million: 5.00
        inference_params:
          default_temperature: 0.1
          max_output_tokens: 64000
        context_window: 200000
        capabilities:
          - code_review
          - real_time_assistants
          - parallel_agents
        notes: >-
          73.3% SWE-bench Verified, fast and
          cost-effective

      # Kimi K2.5 (Bedrock) removed 2026-08-29: `moonshotai.kimi-k2.5` is still
      # ACTIVE on Bedrock (ListFoundationModels, 2026-08-29) - this was CURATION.
      # It was a re-host of a model this registry already carries from its
      # canonical owner: the Moonshot direct provider ships the newer K2.6
      # (`kimi`), at $0.60 in / $2.50 out against the re-host's $0.60 / $3.00, so
      # the direct API is both newer and cheaper on output. Bedrock's Converse
      # parsing for Moonshot models also leaked internal tool-call markers
      # (<|tool_call_begin|>...) into the text field, which is why the entry was
      # supports_tool_use: false; nothing about that improves on the direct API.
      #
      # Alias disposition: the version-neutral `kimi-bedrock` MIGRATED to the
      # Moonshot-direct `kimi-k2.6`, the same move `kimi-azure` made when that
      # deployment went away. It names the Kimi family, and the target really is
      # a Kimi - the provider suffix becomes a lie, which is why it lands in
      # `deprecated_aliases` (resolvable, unadvertised) rather than `aliases`.
      # Unlike the deleted `qwen*-nvidia` names it crosses no billing boundary in
      # the surprising direction: Moonshot-direct is cheaper than the Bedrock
      # re-host it replaces. The version-explicit `kimi25-bedrock` was DELETED,
      # along with the entry id `kimi-k2.5-bedrock`.

      # Qwen3 Coder 480B (Bedrock) removed 2026-07-25 and Qwen3 Coder Next
      # (Bedrock) removed 2026-08-29 - NO Qwen model remains anywhere in this
      # registry:
      #   qwen.qwen3-coder-480b-a35b-v1:0  not offered in us-east-1 (it exists
      #     only in us-west-2, where qwen3-coder-next in turn is absent)
      #   qwen.qwen3-coder-next            still ACTIVE, removed as curation
      # Qwen3 Coder Next was the registry's cheapest Bedrock entry ($0.50/$1.20)
      # and one of only three Bedrock entries on the TOOL-USE structured-output
      # path; `haiku` ($1.00/$5.00) now carries both of those roles alone. That
      # is the cost of this removal, recorded here so re-adding is an informed
      # choice rather than a rediscovery.
      #
      # Every Qwen identifier was DELETED, including the version-neutral `qwen`
      # and `qwen-coder` that the removal convention would normally migrate -
      # there is no Qwen model left to migrate them onto, so the whole family
      # fails fast (same reasoning as `step-flash` in the nvidia block). Also
      # deleted: the entry ids `qwen-next-bedrock` and `qwen-bedrock`, plus
      # `qwen-next`, `qwen3-next` and `qwen-coder-next`.

      # MiniMax M2.5 (Bedrock) removed 2026-08-29, and with it the last MiniMax
      # entry on Bedrock: `minimax.minimax-m2.5` is still ACTIVE there
      # (ListFoundationModels, 2026-08-29), so this was CURATION. It was
      # superseded within the registry by `minimax-m3` on NVIDIA NIM - a newer
      # generation on a free endpoint - while its own pricing was never published
      # by AWS (the entry shipped $0.00/$0.00 placeholders, which surface as
      # "Estimated cost: TBD" rather than a real number, so --dry-run could not
      # price a run against it).
      #
      # `mm2.5-bedrock` and the entry id `minimax-m2.5-bedrock` were both
      # DELETED: version-explicit, and pointing a `-bedrock` name at NVIDIA would
      # cross a provider and a billing boundary (billed Bedrock -> free NIM tier)
      # while claiming to be Bedrock. Joins the already-deleted `mm25`/`mm2.7`
      # names from the earlier MiniMax passes.
      #
      # 2026-09-19 UPDATE: the successor named above is gone too — NIM
      # end-of-lifed `minimaxai/minimax-m3` on 2026-09-09, so NO MiniMax model
      # remains anywhere in this registry and every MiniMax spelling now fails
      # fast. `minimax.minimax-m2.5` on Bedrock was still ACTIVE when cut and
      # deliberately stays out of DEAD_UPSTREAM_FULL_IDS, so it is the one
      # re-add candidate if a MiniMax is wanted again.

      # GLM 5 (Bedrock) — `zai.glm-5` — removed 2026-09-19 as CURATION, at
      # explicit request. This was the GLM re-host on Bedrock; the GLM family
      # is now served by its canonical owner (Z.AI direct, `glm` /
      # `zhipuai/glm-5.3`) and by the free NIM re-host (`glm53-nvidia`), both
      # of which are a full point release ahead of GLM 5 and both verified
      # live 2026-09-19. The entry was a strictly older model on a third
      # provider.
      #
      # NOT an upstream EOL, and deliberately NOT added to
      # DEAD_UPSTREAM_FULL_IDS: `zai.glm-5` was live in the configured
      # us-east-1 at the last check (2026-08-29, ListFoundationModels) and
      # nothing suggests otherwise. It could not be re-verified at removal
      # time — no `aws` CLI in the environment where this ran — which is
      # exactly why it stays out of the dead list: that list means "pointing
      # an entry here is a bug", and an unverified absence is not evidence.
      # This is the re-add candidate if a GLM on Bedrock is wanted again.
      #
      # Alias disposition: `glm5` and `glm-5` MIGRATED onto the Z.AI-direct
      # `zhipuai/glm-5.3` as deprecated_aliases. They name GLM *5* without
      # pinning a minor version, and GLM-5.3 is a GLM 5 — the `gemini-3-flash`
      # case, not the `sonnet4.6` case. Both the old and new targets are
      # billed, so this does not repeat the Qwen-on-NVIDIA free-to-billed
      # trap. One wrinkle recorded because it will look wrong later: Z.AI's
      # catalog *does* serve a distinct `glm-5`, so the alias `glm-5` resolves
      # to 5.3 rather than to the upstream model of the same name. That is the
      # deliberate cost of keeping the name working; `--list-models --verbose`
      # discloses it. The provider-explicit `glm-5-bedrock` and the entry id
      # `glm5-bedrock` were DELETED — the provider suffix names a provider
      # this model is no longer on, and no other entry may answer to it.

  # Azure OpenAI Provider
  azure_openai:
    endpoint: "${AZURE_OPENAI_ENDPOINT}"
    api_key: "${AZURE_OPENAI_API_KEY}"
    api_version: "2025-04-01-preview"
    models:
      # GPT-5.4 Model (base, non-Pro)
      # Frontier reasoning model, GPT-5 family
      # Best for: Code review, complex reasoning, structured output
      # Note: Reasoning model — temperature/top_p NOT supported.
      #   Tool calling IS supported (unlike GPT-5.4 Pro and
      #   DeepSeek-V4-Pro on Azure), so with_structured_output works
      #   without falling back to prompt-based JSON parsing.
      - id: gpt-5.4
        deployment_name: gpt-5.4
        name: GPT-5.4
        aliases:
          - gpt
          - gpt54
          - gpt5.4
        pricing:
          # Azure Foundry standard tier (≤272K input).
          # Confirmed by Microsoft staff (Q&A 2026-03-28),
          # matches OpenAI direct pricing 1:1.
          # >272K long-context tier costs 2x input / 1.5x output:
          # $5.00 / $22.50 — apply manually if you routinely send
          # prompts larger than 272K.
          input_per_million: 2.50
          output_per_million: 15.00
        inference_params:
          # No default_temperature / default_top_p: GPT-5 reasoning
          # models reject these parameters. Reasoning effort defaults
          # to 'medium' on the API side; explicit setting omitted so
          # operators can override per request without a config edit.
          max_output_tokens: 128000
        # Reasoning summaries (chain-of-thought) require Responses API
        # — same rationale as GPT-5.4 Pro and the rest of the GPT-5
        # series on Azure.
        use_responses_api: true
        context_window: 1050000
        capabilities:
          - reasoning
          - code_review
          - security_analysis
          - structured_output
          - function_calling
          - tool_use
        notes: >-
          Frontier reasoning model, 1.05M context,
          128K output, supports reasoning.effort
          low/medium/high/xhigh. Tool calling enabled
          → with_structured_output works directly.

      # GPT-5.4 Pro Model
      # Deeper reasoning variant of GPT-5.4
      # Best for: Complex reasoning, hard problems
      # Note: Responses API only, no structured outputs
      #   but function calling works for structured output
      - id: gpt-5.4-pro
        deployment_name: gpt-5.4-pro
        name: GPT-5.4 Pro
        aliases:
          - gpt54-pro
          - gpt-pro
        pricing:
          input_per_million: 30.00
          output_per_million: 180.00
        inference_params:
          # Temperature/top_p NOT supported with
          # reasoning models (GPT-5.4 Pro always
          # uses reasoning: medium/high/xhigh)
          max_output_tokens: 128000
        # GPT-5.4 Pro uses Responses API
        use_responses_api: true
        context_window: 1050000
        capabilities:
          - reasoning
          - code_review
          - security_analysis
          - function_calling
          - computer_use
        notes: >-
          Deeper reasoning variant of GPT-5.4,
          uses more compute for harder problems,
          supports reasoning.effort medium/high/xhigh

      # Kimi K2.5 (Azure) and DeepSeek-V4-Pro (Azure) removed 2026-07-25: both
      # deployments return DeploymentNotFound on this Azure resource (verified
      # live), and unlike Bedrock/NVIDIA an Azure entry only works if someone
      # has explicitly created a deployment with that exact name. Both models
      # stay reachable via their canonical direct providers: `kimi-k2.6`
      # (Moonshot) and `deepseek-v4-pro` (DeepSeek direct). Re-add from git
      # history if you deploy them on Foundry again.

  # NVIDIA NIM API Provider
  # Models available via build.nvidia.com
  nvidia:
    api_key: "${NVIDIA_API_KEY}"
    # base_url: "${NVIDIA_BASE_URL}"
    # 30 min. This is BOTH the 202-poll budget and the `session.post` read
    # timeout (_NVIDIAClient.timeout is one field serving both, despite a
    # docstring naming only polling), so it is the ceiling on how long a single
    # batch may take. 900 was not enough: `glm53-nvidia` completed a 7-line
    # smoke review in 19m0s, which only finished because a ReadTimeout is
    # retryable and the retry succeeded. Same trap as Bedrock's
    # `read_timeout: 1800` and the same number for the same reason — an
    # always-reasoning model on a non-streaming path emits no bytes until the
    # whole response is generated, so a short read timeout is indistinguishable
    # from an outage. Raising this costs nothing on a healthy request: it is a
    # deadline, not a delay.
    polling_timeout: 1800
    # Retry 504/502/503 up to 5 times
    max_retries: 5
    models:
      # Mistral Small 4 119B (NVIDIA) and Mistral Medium 3.5 128B (NVIDIA)
      # removed 2026-08-29: both endpoints are GONE from the live NIM catalog
      # (GET /v1/models) and a completion answers HTTP 410 with NVIDIA's own
      # end-of-life date attached —
      #   mistralai/mistral-small-4-119b-2603  EOL 2026-07-27
      #   mistralai/mistral-medium-3.5-128b    EOL 2026-08-07
      # Dead endpoints, not merely superseded, and NIM now carries no Mistral
      # newer than mistral-large-2 / mistral-nemotron, so there is no successor
      # to migrate onto and no Mistral model left in this registry. Every
      # identifier was deleted rather than redirected (`mistral-small`,
      # `mistral-small-4`, `ms4`, `mistral-medium`, `mistral-medium-3.5`, and
      # both entry ids): a Mistral name resolving to a non-Mistral model would
      # be worse than the error a human reads and fixes. Re-add from git
      # history if NVIDIA publishes a Mistral Small/Medium successor.
      #
      # NOTE: mistral-medium-nvidia was the only entry in this file carrying
      # `inference_params.reasoning_effort`. The knob is still parsed, still
      # forwarded by the NVIDIA provider, and still covered by
      # tests/test_nvidia_provider.py — it simply has no live user here now.

      # MiniMax M2.7 (NVIDIA) removed 2026-07-25 (superseded by M3) and
      # MiniMax M3 (NVIDIA) removed 2026-09-19 — the whole MiniMax-on-NIM
      # lineage is dead, and with it every MiniMax model in this registry:
      #   minimaxai/minimax-m2.5  NIM deprecated 2026-05-12
      #   minimaxai/minimax-m2.7  still live when dropped as superseded
      #   minimaxai/minimax-m3    HTTP 410 Gone, EOL 2026-09-09
      # Probed 2026-09-19: `GET /v1/models` returns ZERO ids under the
      # `minimax` prefix, and a completion against `minimaxai/minimax-m3`
      # answers 410 with NVIDIA's own message ("has reached its end of life on
      # 2026-09-09T09:00:00Z"). A dead endpoint, not a judgement call. NIM
      # publishes no MiniMax successor, and the Bedrock re-host
      # (`minimax.minimax-m2.5`) was cut in the 2026-08-29 curation pass, so
      # there is nothing MiniMax-shaped anywhere to migrate onto.
      #
      # Every identifier was DELETED, not redirected: `minimax-m3`, `mm3-nvidia`,
      # `mm3` and the entry id `minimax-m3-nvidia`. Same reasoning as
      # `step-flash` and the Qwen family below — a MiniMax name resolving to a
      # non-MiniMax model is worse than the error a human reads and fixes.
      #
      # What the registry loses: its only `enable_thinking`/`clear_thinking`
      # user and its only multimodal NIM entry besides `kimi-k3-nvidia`, which
      # now carries the multimodal-on-NIM slot alone (also free, 1,048,576
      # context vs M3's 1,000,000, also prompt-path). Re-add from git history if
      # NVIDIA publishes a MiniMax successor.

      # Qwen3 Coder 480B (NVIDIA) removed 2026-07-25 and Qwen3.5 397B A17B
      # (NVIDIA) removed 2026-08-29 — the whole Qwen-on-NIM lineage is dead:
      #   qwen/qwen3-coder-480b-a35b-instruct  gone from GET /v1/models (2026-07)
      #   qwen/qwen3.5-397b-a17b               HTTP 410, EOL 2026-07-27
      # NIM now serves no `qwen/*` model at all (verified against the live
      # catalog, which returned zero ids under that prefix), so there is no
      # successor on this provider.
      #
      # Every Qwen-on-NVIDIA identifier was DELETED, not redirected: `qwen3.5`,
      # `qwen35`, `qwen35-nvidia`, `qwen-nvidia`, `qwen3-nvidia`,
      # `qwen-coder-nvidia`, plus the entry id. Note the deliberate choice for
      # the version-*neutral* `qwen-nvidia`/`qwen3-nvidia`/`qwen-coder-nvidia`,
      # which the removal convention would normally migrate: the only live Qwen
      # in this registry at the time was `qwen-next-bedrock`, and pointing a
      # `-nvidia` name at a **Bedrock** entry would silently move the user from
      # a free NIM endpoint to a billed one on a different provider. That is
      # exactly the "worse than an error a human reads and fixes" case, so they
      # fail fast. Later the same day `qwen-next-bedrock` was removed too, so
      # NO Qwen model remains anywhere in the registry - see the Qwen removal
      # note in the bedrock block. Every Qwen spelling now fails fast.

      # DeepSeek-V4-Pro (NVIDIA) removed 2026-09-19 — NIM end-of-lifed the
      # *dated GA* id this entry was re-pointed onto only three weeks earlier:
      #   deepseek-ai/deepseek-v4-pro        EOL 2026-08-07 (the preview)
      #   deepseek-ai/deepseek-v4-pro-0813   EOL 2026-09-14, HTTP 410 Gone
      # Probed 2026-09-19 against `GET /v1/models` (absent) and a completion
      # (410, "has reached its end of life on 2026-09-14T08:00:00Z"). The only
      # `deepseek-ai/*` ids NIM still serves are `deepseek-v4-flash-0731` (the
      # sibling entry below) and the ancient `deepseek-coder-6.7b-instruct`, so
      # there is no Pro-tier successor on this provider. Note the pattern: NIM
      # retired the GA release faster than the preview it replaced — a dated id
      # here is not a stable target, so re-probe this pair whenever you touch
      # this file.
      #
      # All three aliases were DELETED, not migrated onto the surviving Flash
      # entry: `ds-v4-nvidia`, `dsv4-nvidia`, `deepseek-v4-nvidia`, plus the
      # entry id `deepseek-v4-pro-nvidia`. The names look version-neutral, and
      # `dsv4-flash-nvidia` is the same vendor, same generation, same provider
      # and the same free tier — but Pro and Flash shipped as SEPARATE
      # concurrent entries here, so `dsv4-nvidia` has always meant "the Pro one"
      # in explicit opposition to `dsv4-flash-nvidia`. Redirecting it would
      # silently hand a caller who chose the 1.65T flagship the 284B budget
      # model. Use `dsv4-flash-nvidia` (free, on NIM) or `deepseek-v4-pro`
      # (DeepSeek direct, the family's canonical owner, same 1.65T model —
      # but BILLED at $1.32/$3.96 per M).
      #
      # Evidence that outlives the entry: `thinking: false` on Pro-0813 was
      # *not* load-bearing (it reasoned only when asked), whereas on
      # Flash-0731 it is — see the sibling entry's note, which is now the only
      # record of that contrast.

      # DeepSeek-V4-Flash (NVIDIA) removed 2026-09-19 — and this one was
      # removed on a SCHEDULED sunset, not a 410, which is a first for this
      # file. `deepseek-ai/deepseek-v4-flash-0731` still answered HTTP 200 the
      # day it was dropped, but the response carried NVIDIA's own
      # machine-readable sunset in-band:
      #
      #   deprecation: 2026-09-21T08:00:00Z
      #
      # Probe the HEADERS, not just the status. A 200 with a `deprecation`
      # header is a dead entry with a date on it, and the usual "verify against
      # the live endpoint" check reads it as healthy. Worth knowing that NIM
      # emits this: it is the only advance warning this registry has ever got.
      #
      # With the Pro-0813 sibling end-of-lifed 2026-09-14 (note above), NIM now
      # serves no reviewable DeepSeek at all — only the ancient
      # `deepseek-coder-6.7b-instruct`. The model itself stays reachable from
      # its canonical owner as `dsv4-flash` on the DeepSeek direct provider,
      # but that is BILLED where this was free.
      #
      # All three identifiers were DELETED, not migrated: the entry id
      # `deepseek-v4-flash-nvidia` plus `dsv4-flash-nvidia` and
      # `ds-v4-flash-nvidia`. Every one carries the `-nvidia` suffix, and the
      # only place to send them is the billed DeepSeek-direct entry on a
      # different provider — the same "silently moves the user from a free
      # endpoint to a billed one" case that deleted the Qwen-on-NVIDIA names.
      #
      # Evidence worth preserving, since this entry was its only record:
      # `thinking: false` was LOAD-BEARING here and NOT on Pro-0813, which is
      # why this entry alone among the NIM thinking models sat on the tool-use
      # path. Verified live 2026-08-29: Flash-0731 reasoned *by default* (two
      # probes returned `reasoning_content`, one burning a whole 400-token
      # budget on reasoning and returning no content at all); with
      # `thinking: false` the reply carried no `reasoning_content` **and** a
      # forced `tool_choice` came back as a real `tool_calls` entry. Pro-0813
      # reasoned only when asked. If NVIDIA ships a V4-Flash successor, re-probe
      # that flag rather than assuming it carries over — and note the free
      # high-volume slot it vacated is now held by `glm53-flash-nvidia` below.

      # Kimi K3 (via NVIDIA) - Moonshot AI flagship
      # MoE: 2.8T total, 104B active, 896 experts (16 routed + 2 shared
      # per token); Kimi Delta Attention (69 KDA + 24 gated MLA layers),
      # Attention Residuals, Stable LatentMoE, 401M MoonViT-V2 vision
      # encoder. Quantization-aware trained (MXFP4 weights/MXFP8 acts).
      # Best for: long-horizon agentic coding, whole-repo review at 1M
      #   context, multimodal review (text + image in, text out)
      - id: kimi-k3-nvidia
        full_id: moonshotai/kimi-k3
        name: Kimi K3 (NVIDIA)
        # NVIDIA-suffixed aliases only — the bare `kimi-k3`/`kimi3` stay
        # reserved for the Moonshot direct provider, canonical owner of the
        # Kimi family (it currently ships K2.6). This is now the only Kimi on
        # NIM: the K2.6 re-host was removed 2026-08-29 (note below).
        aliases:
          - kimi-nvidia-3
          - kimi3-nvidia
        pricing:
          # Free/non-commercial NVIDIA NIM trial endpoint
          input_per_million: 0.00
          output_per_million: 0.00
        inference_params:
          # The model card's own evaluation config: temperature=1.0 with
          # top_p=0.95 for single-step tasks (its top_p=1.0 is for agentic
          # loops, which a one-shot review is not). Same fixed pair
          # Moonshot requires for K2.6.
          default_temperature: 1.0
          default_top_p: 0.95
          # Double the K2.6 sibling's 16384: thinking cannot be switched
          # off here and NIM bills reasoning inside completion_tokens, so
          # the report needs headroom above the reasoning it follows.
          max_output_tokens: 32768
        # Input Context Length (ISL) per the model card: 1,048,576
        context_window: 1048576
        # Thinking is ALWAYS enabled on K3 (model card, Output properties:
        # "Thinking is always enabled") with no knob to disable it — the
        # constant, not intermittent, forced-tool_choice-while-thinking
        # profile, same as Fable 5. Tool-use is unproven on
        # this endpoint (NIM's free tier rate-limited the probe), so the
        # assume-prompt-parsing rule applies; K2.6 on Moonshot-direct is
        # prompt-path for the same reason. Flip to true only if a live review
        # run proves tool-use while thinking.
        supports_tool_use: false
        architecture: "MoE (2.8T total, 104B active, 896 experts, multimodal)"
        capabilities:
          - code_review
          - code_generation
          - reasoning
          - agentic_tasks
          - thinking
          - multimodal
        notes: >-
          Native multimodal agentic model (text/image in, text out),
          1M-token context, always-on thinking with low/high/max effort
          levels. Modified MIT, commercial use allowed. Free NVIDIA NIM
          trial endpoint. Prompt-based JSON parsing.

      # Kimi K2.6 (NVIDIA) removed 2026-08-29 as CURATION - NOT because the
      # endpoint is dead, and this distinction matters for anyone re-adding it.
      # `moonshotai/kimi-k2.6` IS still listed by NIM's `GET /v1/models`; what it
      # returns for this account is HTTP 404 "Function ...: Not found for account
      # ...", i.e. account-scoped provisioning, not an EOL. That is a different
      # failure from the five entries removed the same day, which answered HTTP
      # 410 with NVIDIA's own EOL date. An account cleared for that function
      # would have had a working entry, which is why `moonshotai/kimi-k2.6` is
      # deliberately NOT in DEAD_UPSTREAM_FULL_IDS (tests/test_config.py).
      #
      # What made it expendable regardless: it is a re-host of a model the
      # registry already carries from its canonical owner (`kimi` on Moonshot
      # direct, same K2.6, same fixed temperature=1.0/top_p=0.95, same
      # prompt-parsing path), and the newer `kimi-k3-nvidia` above covers the
      # Kimi-on-NIM slot with a working endpoint and 4x the context.
      #
      # `kimi-nvidia-26`, `kimi26-nvidia` and the entry id `kimi-k2.6-nvidia`
      # were all DELETED - version-explicit, and the surviving NIM Kimi is a
      # different generation. Use `kimi-nvidia-3` (K3 on NIM) or `kimi`
      # (K2.6 on Moonshot direct). The K2.5-on-NIM names (kimi-k2.5,
      # kimi-k2.5-nvidia, kimi25) were already deleted on 2026-07-25 when NVIDIA
      # shut that endpoint down.

      # GLM-5.2 (NVIDIA) removed 2026-08-29: `z-ai/glm-5.2` is GONE from the
      # live NIM catalog and a completion answers HTTP 410 — NVIDIA end-of-lifed
      # it 2026-08-21, closing out the GLM-on-NVIDIA lineage as it then stood
      # (z-ai/glm5 deprecated 2026-04-20 -> z-ai/glm-5.1 deprecated ~2026-07 ->
      # z-ai/glm-5.2 EOL 2026-08-21).
      #
      # 2026-09-19 UPDATE: GLM is BACK on NIM — `z-ai/glm-5.3` and
      # `z-ai/glm-5.3-flash` are listed and both answer HTTP 200 (entries
      # below). That does NOT revive any 5.2 name: the deletions below stand,
      # because every one of them spells a version GLM-5.3 is not. This is the
      # counter-example to reading a whole-prefix disappearance as permanent —
      # "NIM serves no `z-ai/*` at all" was true for three weeks.
      #
      # The NVIDIA-suffixed names were DELETED (`glm52` - the entry id - plus
      # `glm52-nvidia`, `glm5.2-nvidia`, `glm-5.2-nvidia`, `glm5-nvidia`):
      # nothing GLM-shaped is left on this provider to point them at.
      #
      # The version-neutral `glm5`/`glm-5` MIGRATED to `glm5-bedrock` instead of
      # being deleted, and note they land on the model they actually name: those
      # spellings say GLM *5*, and `zai.glm-5` on Bedrock is GLM 5 and is live in
      # the configured us-east-1 (verified against ListFoundationModels). That
      # is a provider *and* a billing change from the free NIM endpoint they used
      # to reach, which is why they stay `deprecated_aliases` — resolvable, but
      # not advertised by --list-models. For a current direct GLM use Z.AI's
      # `glm` / `zhipuai/glm-5.3`; version-specific 5.2 names are retired.

      # GLM-5.3 (via NVIDIA) — Z.ai text-only flagship, added 2026-09-19.
      # MoE: 753B total / ~40B active, 78 layers (3 dense + 75 MoE), 256 routed
      # experts top-8 + 1 shared, DeepSeek Sparse Attention (2,048 tokens per
      # query), 1 MTP draft layer. Same base model as GLM-5.2 — every gain came
      # from post-training. Best for: repo-scale agentic coding and whole-repo
      # review at 1M context.
      #
      # Verified live 2026-09-19: listed by `GET /v1/models` and a completion
      # returns HTTP 200 with no `deprecation` header.
      #
      # LATENCY WARNING, measured not guessed: a 13-token prompt at
      # `reasoning_effort=low` capped to 8 output tokens took **4m50s**
      # wall-clock. This endpoint serves an NVFP4-quantized checkpoint on
      # two-node GB300 workers with CPU KV-cache offloading, and the
      # non-streaming path returns nothing until generation finishes, so a real
      # review batch is far slower than every other entry in this file: a
      # **7-line** single-file review measured **19m0s** end to end (exit 0, a
      # genuine structured report). That is the floor, not the average — it is
      # what this endpoint costs to review almost nothing. The provider-level
      # `polling_timeout: 1800` above exists for this entry; at the old 900 the
      # same run only survived on a ReadTimeout retry. Also expect
      # NVIDIA-gateway 504s, which `max_retries: 5` with the 4s 504 base wait is
      # there to absorb. Prefer `glm-5.3-flash-nvidia` below (3m03s on the same
      # file) for anything resembling a CI run.
      - id: glm-5.3-nvidia
        full_id: z-ai/glm-5.3
        # NVIDIA-suffixed aliases only — the bare `glm`, `glm-5.3`, `glm5.3`
        # are claimed by the Z.AI direct provider, canonical owner of the GLM
        # family. Deliberately NOT reusing `glm5-nvidia`/`glm5.2-nvidia` etc:
        # those were deleted with the 5.2 entry and must keep failing fast.
        name: GLM-5.3 (NVIDIA)
        aliases:
          - glm53-nvidia
          - glm5.3-nvidia
        pricing:
          # Free endpoint on build.nvidia.com
          input_per_million: 0.00
          output_per_million: 0.00
        inference_params:
          # Mirror the Z.AI-direct GLM-5.3 entry: temperature 1.0, and omit
          # top_p so the server keeps its documented default.
          default_temperature: 1.0
          max_output_tokens: 32768
          # The card's default is `max`. Pin `high` instead: reasoning bills
          # inside completion_tokens on NIM, so max effort eats the output
          # budget the report needs, and this endpoint is slow enough already
          # (see the latency warning). `max` is not expressible here anyway —
          # InferenceParams.reasoning_effort is Literal[none|low|medium|high].
          reasoning_effort: high
          # NOTE: `clear_thinking: true` is deliberately NOT set even though
          # both cards recommend it "for chat scenarios". It clears reasoning
          # from PRIOR turns, and a review request is single-turn, so it would
          # be an inert knob — and this file already carries the cost of one of
          # those (see the reasoning_effort note in the Mistral removal block).
        # Card figure: 1,048,576 (the Z.AI-direct sibling rounds to 1,000,000).
        context_window: 1048576
        # Reasoning is always on with no off switch — the constant
        # forced-tool_choice-while-thinking profile, same as Kimi K3 above and
        # both Z.AI-direct GLM-5.3 entries. The card's "tool calls are emitted
        # in OpenAI-compatible form" is not evidence that a FORCED tool_choice
        # survives thinking, which is what .with_structured_output sets, so the
        # assume-prompt-parsing rule applies. Flip to true only if a live
        # review run proves otherwise.
        supports_tool_use: false
        architecture: "MoE (753B total, ~40B active, DeepSeek sparse attention)"
        capabilities:
          - code_review
          - code_generation
          - reasoning
          - agentic_tasks
          - thinking
          - long_horizon_agentic
        notes: >-
          Z.ai text-only flagship on NIM's free tier, 1M-token context,
          always-on reasoning at low/high/max effort. Leads CyberGym for
          vulnerability discovery, which makes it a strong security reviewer.
          MIT-like licence (a Model-as-a-Service operator above $10B revenue
          needs a Z.ai security review). Served NVFP4-quantized, so outputs
          may differ from full precision in edge cases, and it is by far the
          slowest endpoint in this registry. Prompt-based JSON parsing.

      # GLM-5.3-Flash (via NVIDIA) — first natively multimodal GLM-5, added
      # 2026-09-19. MoE: 320B total / 18B active, 45 layers in a hybrid
      # attention stack (34 KDA linear-attention + 11 DeepSeek-sparse, every
      # fourth), Manifold-Constrained Hyper-Connections, 288 routed experts
      # top-8, a vision encoder, 1 MTP layer; 30T-token multimodal
      # pre-training. Best for: high-volume review and CI, multimodal review
      # (text + up to 8 images in, text out).
      #
      # Verified live 2026-09-19: HTTP 200, no `deprecation` header, and
      # `reasoning_effort` accepted. Answered in seconds, unlike its sibling
      # above — native FP8 on 8xH100 rather than NVFP4 on GB300.
      - id: glm-5.3-flash-nvidia
        full_id: z-ai/glm-5.3-flash
        name: GLM-5.3-Flash (NVIDIA)
        # NVIDIA-suffixed only; `glm-flash`, `glm53-flash`, `glm5.3-flash`
        # belong to the Z.AI direct entry.
        aliases:
          - glm53-flash-nvidia
          - glm-flash-nvidia
        pricing:
          # Free endpoint on build.nvidia.com
          input_per_million: 0.00
          output_per_million: 0.00
        inference_params:
          # Mirror the Z.AI-direct GLM-5.3-Flash entry.
          default_temperature: 1.0
          default_top_p: 0.95
          max_output_tokens: 32768
          # Same reasoning as the sibling above.
          reasoning_effort: high
        context_window: 1048576
        # Always-on reasoning; see the sibling entry for why the prompt path.
        supports_tool_use: false
        architecture: "MoE (320B total, 18B active; hybrid sparse/linear attention, multimodal)"
        capabilities:
          - code_review
          - code_generation
          - reasoning
          - agentic_tasks
          - thinking
          - multimodal
        notes: >-
          Native multimodal GLM-5 (text/image in, text out), 1M-token context,
          always-on reasoning at low/high/max effort, and roughly a tenth of
          GLM-5.2's price on the vendor's own API — free here on NIM's trial
          tier. The fast, cheap NIM default for high-volume review; use
          `glm53-nvidia` when you want the 753B flagship and can wait. MIT.
          Prompt-based JSON parsing.

      # Step 3.5 Flash (NVIDIA) removed 2026-07-25 and Step 3.7 Flash (NVIDIA)
      # removed 2026-08-29 — no StepFun model remains on NIM:
      #   stepfun-ai/step-3.7-flash  HTTP 410, EOL 2026-08-28
      # The live catalog returns zero ids under the `stepfun` prefix, so 3.5 (an
      # endpoint that was merely superseded in July) is gone as well.
      #
      # Every Step identifier was DELETED, including the version-neutral
      # `step-flash` and `step-nvidia` that the removal convention would
      # normally migrate — there is no Step model anywhere in this registry to
      # migrate them onto. Also deleted: `step-3.7`, `step37`, `step37-nvidia`
      # and the entry id `step-3.7-flash`. Re-add from git history if NVIDIA
      # publishes a StepFun successor.

  # Google Generative AI Provider
  # Models via Google AI Studio / Gemini API
  google_genai:
    api_key: "${GOOGLE_API_KEY}"
    models:
      # Gemini 3.1 Pro Preview - Most advanced reasoning
      # 1M token context, Deep Think with 3 levels
      # 77.1% ARC-AGI-2, 94.3% GPQA Diamond
      - id: gemini-3.1-pro
        full_id: gemini-3.1-pro-preview
        name: Gemini 3.1 Pro Preview
        aliases:
          - gemini31-pro
          - gemini-pro
        # Back-compat only: resolves, but hidden from --list-models
        # (see --list-models --verbose).
        # Named Gemini 3 Pro, whose endpoint shut down 2026-03-09.
        deprecated_aliases:
          - gemini-3-pro
          - gemini3-pro
        pricing:
          input_per_million: 2.00
          output_per_million: 12.00
        inference_params:
          default_temperature: 0.1
          default_top_p: 0.95
          max_output_tokens: 65536
        context_window: 1000000
        capabilities:
          - code_review
          - reasoning
          - multimodal
          - tool_use
          - agentic_tasks
        notes: >-
          77.1% ARC-AGI-2, 94.3% GPQA Diamond,
          2x reasoning over Gemini 3 Pro,
          Deep Think with 3 levels

      # Gemini 3.8 Flash - latest Flash generation (September 2026)
      # 1M token context, 64K output, thinking at low/medium/high
      - id: gemini-3.8-flash
        full_id: gemini-3.8-flash
        name: Gemini 3.8 Flash
        aliases:
          - gemini-flash
          - gemini38-flash
          - gemini3.8-flash
        # Back-compat only: resolves, but hidden from --list-models
        # (see --list-models --verbose). Absorbed 2026-09-19 from the removed
        # Gemini 3.7 Flash entry, which had inherited them from 3.6 Flash
        # (2026-08-29) and before that from Gemini 3 Flash Preview
        # (2026-07-25). They state generation *3* without pinning a minor, and
        # 3.8 Flash is a generation-3 Flash at the same $1.50/$7.50, the same
        # 1M context and the same 64K output cap, so following them forward
        # does not change what the name claims. Deprecated rather than
        # advertised because all three were minted for models several
        # releases back.
        deprecated_aliases:
          - gemini-3-flash
          - gemini3-flash
          - g3flash
        pricing:
          # Verified: ai.google.dev/gemini-api/docs/pricing (2026-09-09).
          # Record the standard rate rather than the introductory
          # $0.75/$3.75 rate that ends 2026-12-31, so estimates do not
          # under-state costs after 2027-01-01.
          input_per_million: 1.50
          output_per_million: 7.50
        inference_params:
          # Sampling params remain deprecated for Gemini 3.8 Flash.
          max_output_tokens: 65536
        context_window: 1000000
        # This is a thinking model. The card advertises structured output and
        # function calling, but unlike 3.7 no live review has yet proved forced
        # tool use while thinking, so the prompt path is required by policy.
        supports_tool_use: false
        capabilities:
          - code_review
          - reasoning
          - multimodal
          - agentic_tasks
          - computer_use
          - thinking
        notes: >-
          Most intelligent Flash model (September 2026), optimized for
          long-horizon software engineering, autonomous agents and complex
          enterprise workflows. 1M-token context (1,048,576), up to 64K
          output, and low/medium/high thinking levels; "minimal" is rejected.
          Sampling params are deprecated and omitted. Uses prompt-based
          structured output until a live run proves tool use while thinking.

      # Gemini 3.7 Flash — `gemini-3.7-flash` — removed 2026-09-19 as
      # CURATION, at explicit request. Verified still live the same day
      # (present in `GET /v1beta/models`; a completion returned 503
      # "experiencing high demand", which is load, not deprecation). Removed
      # because 3.8 Flash supersedes it at the IDENTICAL $1.50/$7.50, identical
      # 1M context and identical 64K output cap — the same
      # strict-duplicate-of-a-newer-sibling reasoning that retired 3.6 Flash.
      #
      # ⚠️ COST OF THIS REMOVAL, recorded because it cannot be recovered by
      # reading the remaining entries: 3.7 Flash was the ONLY entry in the
      # registry that had won `supports_tool_use: true` back with a live run
      # while thinking (three runs, 2026-08-17, each a valid CodeReviewReport
      # with parsing_error None and output_token_details.reasoning > 0). It was
      # the documented bar for ever flipping 3.8 Flash or either GLM-5.3 entry
      # off the prompt path, and the reference case for "a thinking model CAN
      # keep the tool-use path". With it gone, no entry anywhere in this file
      # demonstrates that; the evidence survives only in git history and in
      # docs/structured-output.md. Re-establishing the bar means re-running
      # that A/B, not citing 3.7.
      #
      # Alias disposition: the generation-3 names `gemini-3-flash`,
      # `gemini3-flash` and `g3flash` MIGRATED onto gemini-3.8-flash as
      # deprecated_aliases — 3.8 is a generation-3 Flash at the same price and
      # the same limits, so the names stay truthful, exactly as they did when
      # they moved 3.6 → 3.7. The version-explicit `gemini37-flash`,
      # `gemini3.7-flash` and the entry id `gemini-3.7-flash` were DELETED: a
      # name that pins the minor version must not answer from a different one.
      # Gemini 3 Flash Preview removed 2026-07-25, Gemini 3.6 Flash removed
      # 2026-08-29, Gemini 3.7 Flash removed 2026-09-19 (note above);
      # gemini-3.8-flash is now the only live Flash entry:
      #   gemini-3-flash-preview  DEPRECATED upstream (announced 2025-12-17),
      #     with gemini-3.6-flash named as its replacement. Still live on the
      #     API; re-add from git history for the cheaper $0.50/$3.00 rate.
      #   gemini-3.6-flash        still live, removed as CURATION: 3.7 Flash
      #     supersedes it at the IDENTICAL $1.50/$7.50, identical 1M context and
      #     identical 64K output cap, on the same tool-use structured-output
      #     path, so the entry was a strict duplicate of a newer sibling.
      #
      # Alias disposition: the generation-3 names `gemini-3-flash`,
      # `gemini3-flash` and `g3flash` MIGRATED onto gemini-3.7-flash as
      # deprecated_aliases - 3.7 is a generation-3 Flash at the same price and
      # limits, so the names stay truthful (this is the `glm5` case, not the
      # `sonnet4.6` case). The version-explicit `gemini36-flash`,
      # `gemini3.6-flash` and the entry id `gemini-3.6-flash` were DELETED: a
      # name that pins the minor version must not answer from a different one.

  # DeepSeek Direct API Provider
  # Uses langchain-deepseek's ChatDeepSeek (purpose-built single-purpose
  # package, not the heavy langchain-community).
  # OpenAI-format compatible at https://api.deepseek.com.
  # Both V4-Pro and V4-Flash support tool calling and structured output
  # natively (unlike DeepSeek-V4-Pro on Azure Foundry, which requires
  # prompt-based JSON parsing because SGLang doesn't expose tools).
  deepseek:
    api_key: "${DEEPSEEK_API_KEY}"
    api_base: "https://api.deepseek.com"
    request_timeout: 300
    models:
      # DeepSeek V4 Pro - flagship reasoning + agentic model
      # 1M context, 384K max output, three reasoning modes
      - id: deepseek-v4-pro
        full_id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        aliases:
          - dsv4-pro
          - ds-v4-pro
        # Back-compat only: resolves, but hidden from --list-models
        # (see --list-models --verbose).
        # Absorbed from the removed DeepSeek-V4-Pro (Azure) entry, whose Foundry
        # deployment is gone (2026-07-25). DeepSeek direct is the canonical
        # owner of this family, so no -azure name is advertised.
        deprecated_aliases:
          - deepseek-v4-pro-azure
          - deepseek-v4-azure
          - ds-v4-azure
        pricing:
          # Peak rates verified against DeepSeek's official pricing table on
          # 2026-09-09. The API charges half-price off peak; recording peak
          # rates prevents the CLI from under-estimating weekday peak runs.
          input_per_million: 1.32
          output_per_million: 3.96
        inference_params:
          # Lower temp for code review determinism (model default 1.0)
          default_temperature: 0.3
          default_top_p: 0.95
          max_output_tokens: 16384
        context_window: 1000000
        capabilities:
          - reasoning
          - code_review
          - code_generation
          - structured_output
          - tool_use
          - thinking
        notes: >-
          Flagship V4 model: chain-of-thought reasoning, JSON mode,
          tool calling, 1M context. Direct API supports thinking mode
          toggle (unlike Azure Foundry deployment).

      # DeepSeek V4 Flash - cost-efficient instant model
      # Same 1M context, much cheaper, faster
      - id: deepseek-v4-flash
        # Renamed upstream. `GET /v1/models` on 2026-09-19 lists exactly
        # `deepseek-flash` and `deepseek-v4-pro` — there is no
        # `deepseek-v4-flash` row. The old spelling still answers HTTP 200, but
        # the response body's own `model` field comes back as `deepseek-flash`,
        # so it is an undocumented legacy alias the server silently rewrites.
        # Point `full_id` at the id the server reports: an out-of-catalog alias
        # is invisible until the day it 404s, and this registry's
        # model-access validation exact-matches against the catalog, so the
        # old value would have reported a miss for a model that is present.
        # The entry `id` stays `deepseek-v4-flash` so no documented
        # `--model` name changes.
        full_id: deepseek-flash
        name: DeepSeek-V4-Flash
        aliases:
          - dsv4-flash
          - ds-v4-flash
        pricing:
          # Peak rates verified against DeepSeek's official pricing table on
          # 2026-09-09. Off-peak rates are $0.22/$0.66; cost estimates use the
          # peak $0.44/$1.32 rates so they do not under-state a run.
          input_per_million: 0.44
          output_per_million: 1.32
        inference_params:
          default_temperature: 0.3
          default_top_p: 0.95
          max_output_tokens: 16384
        context_window: 1000000
        capabilities:
          - code_review
          - code_generation
          - structured_output
          - tool_use
        notes: >-
          Cost-efficient flash variant, same 1M context and 384K vendor output
          ceiling as V4-Pro. The registry keeps a conservative 16K output cap
          for one-shot reviews. Best for high-volume reviews and CI.

  # Moonshot AI (Kimi) Direct API Provider
  # Uses langchain-moonshot's ChatMoonshot, which extends BaseChatOpenAI
  # and handles Kimi-specific parameter constraints (kimi-k2.5 thinking
  # mode requires temperature=1.0 / top_p=0.95; kimi-k2.6 server-side
  # rejects `tool_choice='specified'` while thinking is enabled, so we
  # route k2.6 through prompt-based JSON parsing — see supports_tool_use
  # below).
  #
  # Two separate platforms with separate accounts/keys:
  #   - .cn (Chinese): https://api.moonshot.cn/v1   (platform.moonshot.cn)
  #   - .ai (international): https://api.moonshot.ai/v1  (platform.moonshot.ai)
  # KIMI_API_KEY usually maps to the .cn console. Override base_url here
  # if your key is from platform.moonshot.ai instead.
  moonshot:
    api_key: "${KIMI_API_KEY}"
    base_url: "https://api.moonshot.cn/v1"
    # 10 min. Raised 300 -> 600 when K3 replaced K2.6 (2026-09-19): K3 is an
    # always-thinking 1M-context model with a 32K output budget, which is the
    # exact profile that made NVIDIA's 900s too small. Unlike NIM it is fast --
    # MEASURED, not assumed: a live review of a 6-line file completed in 26.4s
    # end to end, two batches' worth of headroom inside the old 300 already. The
    # extra margin is for a *real* batch (~100K input, think-heavy), which no
    # probe here has timed. Raising a deadline costs nothing on a healthy
    # request, and the NVIDIA lesson is that a run which exceeds the ceiling but
    # still exits 0 -- because a ReadTimeout happens to be retryable -- hides the
    # misconfiguration while doubling the bill. Set from the slowest entry this
    # provider serves, not the typical one.
    request_timeout: 600
    models:
      # Kimi K3 — Moonshot's flagship, upgraded from K2.6 on 2026-09-19.
      # MoE: 2.8T total / 104B active, 896 experts (16 routed + 2 shared per
      # token), Kimi Delta Attention + Attention Residuals, Stable LatentMoE,
      # native visual understanding, 1M context. First open-weight model in the
      # 3-trillion-parameter class.
      #
      # Verified live 2026-09-19 against api.moonshot.cn: listed by
      # `GET /v1/models` (alongside kimi-k2.7-code, kimi-k2.7-code-highspeed
      # and kimi-k2.6), and a completion returns HTTP 200 with no `deprecation`
      # header.
      #
      # ACCESS NOTE: K3 is a flagship tier — Moonshot unlocks it only after a
      # successful top-up (minimum $1). A brand-new key that works for K2.6 can
      # still be refused here, and that is an account state, not a config bug.
      - id: kimi-k3
        full_id: kimi-k3
        name: Kimi K3 (Moonshot)
        # This entry is the canonical owner of the bare Kimi names (the NIM
        # re-host `kimi-k3-nvidia` keeps provider-suffixed ones only, and its
        # comment already reserves `kimi3` for exactly this entry).
        aliases:
          - kimi
          - kimi3
        # Back-compat only: resolves, but hidden from --list-models
        # (see --list-models --verbose).
        # The first four were absorbed from the removed Kimi K2.5 (Azure) entry,
        # whose Foundry deployment is gone (2026-07-25), and the removed Kimi
        # K2.5 (Bedrock) entry (2026-08-29); they are version-neutral names for
        # the Kimi family whose provider suffix no longer holds. Inherited again
        # here because this entry replaced K2.6 as the family's canonical owner.
        #
        # The version-explicit `kimi26` and the old entry id `kimi-k2.6` were
        # DELETED rather than migrated: K2.6 is a different, still-live model
        # (Moonshot still serves it at $0.95/$4.00 on 256K context), so
        # answering to its name from K3 would silently swap a model AND
        # roughly triple the bill. Re-add K2.6 as its own entry from git
        # history if it is wanted alongside K3.
        deprecated_aliases:
          - kimi-k2.5-azure
          - kimi-azure
          - kimi25-azure
          - kimi-bedrock
        pricing:
          # Authoritative: platform.moonshot.ai/docs/pricing/chat, fetched
          # 2026-09-19. Cache-hit input is $0.30 and caching is automatic with
          # no opt-in, so a repeated long prefix bills well under the figure
          # here — this records the cache-MISS rate, which over-states rather
          # than under-states. Note this replaces a wrong number: the K2.6
          # entry carried $0.60/$2.50 with a comment admitting the page "wasn't
          # directly fetchable at config time", and K2.6's real rate was
          # $0.95/$4.00.
          input_per_million: 3.00
          output_per_million: 15.00
        inference_params:
          # temperature=1.0, top_p=0.95, n=1 and both penalties are FIXED
          # server-side on K3 and the model card says to omit them from
          # requests — so both are omitted here rather than sent at their
          # fixed values. MoonshotProvider passes allow_none=True to
          # _resolve_temperature, so an absent default_temperature sends no
          # temperature at all; a probe with neither field returned HTTP 200.
          # This is a change from the K2.6 entry, which sent both explicitly.
          #
          # The card's reasoning_effort default is `max`. Pin `high`: reasoning
          # bills inside completion_tokens at $15/M output, so max effort both
          # inflates the bill and eats the budget the report needs.
          # `max` is not expressible anyway —
          # InferenceParams.reasoning_effort is Literal[none|low|medium|high].
          reasoning_effort: high
          # Server default is 131072, ceiling 1048576. 32768 matches the
          # kimi-k3-nvidia sibling: thinking cannot be switched off and
          # reasoning is billed inside completion_tokens, so the report needs
          # headroom above the reasoning it follows — but not 128K of it at
          # this output price.
          max_output_tokens: 32768
        context_window: 1048576
        # LIVE-VERIFIED, not assumed (2026-09-19): a forced tool_choice of the
        # exact shape `.with_structured_output()` emits —
        # {"type":"function","function":{"name":...}} — returns HTTP 400
        # "tool_choice 'specified' is incompatible with thinking enabled",
        # byte-identical to K2.6's failure, and K3 has thinking permanently on
        # with no off switch. So this is one of the few `false` values in this
        # file backed by a reproduction rather than by the
        # assume-prompt-parsing rule. The card does advertise `json_schema`
        # structured output and `tool_choice="required"`, neither of which is
        # the forced-single-function form LangChain uses — don't let the card
        # talk you into flipping this without re-running the probe.
        supports_tool_use: false
        architecture: "MoE (2.8T total, 104B active, 896 experts)"
        capabilities:
          - reasoning
          - code_review
          - code_generation
          - long_horizon_agentic
          - multimodal
          - structured_output
          - thinking
        notes: >-
          Flagship long-horizon agentic coding and knowledge work with
          always-on thinking and a 1M-token context. Tool use conflicts with
          thinking on Moonshot's server (reproduced 2026-09-19), so structured
          output is produced via prompt-based JSON parsing
          (PydanticOutputParser) — see supports_tool_use above.

  # Z.AI (Zhipu International) Provider
  # OpenAI-compatible endpoint at https://api.z.ai/api/paas/v4/
  # Models exposed via langchain-openai's ChatOpenAI with custom base_url
  # — no langchain-community dependency.
  zai:
    api_key: "${ZAI_API_KEY}"
    base_url: "https://api.z.ai/api/paas/v4/"
    request_timeout: 300
    models:
      # GLM-5.3 (Z.AI) — current flagship, superseding GLM-5.2 at the same
      # $1.40/$4.40 list price. Text-only, 1M context, 128K output ceiling,
      # always-on reasoning at low/high/max effort, function calling and JSON
      # structured output. https://docs.z.ai/guides/llm/glm-5.3
      - id: zhipuai/glm-5.3
        full_id: glm-5.3
        name: GLM-5.3 (Z.AI)
        aliases:
          - glm
          - glm-5.3
          - glm5.3
          - zai-glm
          - glm-zai
        # Back-compat only: resolves, but hidden from --list-models
        # (see --list-models --verbose). Absorbed 2026-09-19 from the removed
        # GLM 5 (Bedrock) entry, which had itself absorbed them from the
        # GLM-5.2 (NVIDIA) entry NVIDIA end-of-lifed 2026-08-21. They say
        # GLM *5* without pinning a minor, and this is a GLM 5 — see the
        # removal note in the bedrock block for the full disposition,
        # including why `glm-5` resolving here rather than to Z.AI's own
        # `glm-5` is intended.
        deprecated_aliases:
          - glm5
          - glm-5
        pricing:
          # Official pay-as-you-go rates, verified 2026-09-09.
          input_per_million: 1.40
          output_per_million: 4.40
        inference_params:
          # GLM-5.3 defaults to temperature=1.0/top_p=0.95. Setting the
          # temperature is necessary because ZAIProvider's generic fallback is
          # 0.3; omit top_p so the server keeps its documented default.
          default_temperature: 1.0
          max_output_tokens: 32768
        context_window: 1000000
        # Reasoning cannot be disabled. Ship on prompt parsing until a live
        # review proves forced tool use works while the model is thinking.
        supports_tool_use: false
        capabilities:
          - reasoning
          - code_review
          - code_generation
          - long_horizon_agentic
          - tool_use
          - structured_output
          - thinking
        notes: >-
          Latest Z.AI flagship, with a reported 50% gain over GLM-5.2 on Z.ai
          Code Bench. Always-on reasoning defaults to max effort. The vendor
          ceiling is 128K output; this registry uses a conservative 32K cap.
          Structured output uses prompt parsing pending a live forced-tool-use
          review while thinking.

      # GLM-5.3-Flash — latest low-cost GLM and the first native multimodal
      # model in the GLM-5 family. 320B total / 18B active, 1M context.
      # https://docs.z.ai/guides/vlm/glm-5.3-flash
      - id: zhipuai/glm-5.3-flash
        full_id: glm-5.3-flash
        name: GLM-5.3-Flash (Z.AI)
        aliases:
          - glm-flash
          - glm53-flash
          - glm5.3-flash
        pricing:
          # Record the $0.15/$0.50 list rate, not the temporary 50%-off
          # $0.075/$0.25 promotion shown on the official pricing page.
          input_per_million: 0.15
          output_per_million: 0.50
        inference_params:
          # Vendor-recommended defaults for this always-thinking model.
          default_temperature: 1.0
          default_top_p: 0.95
          max_output_tokens: 32768
        context_window: 1000000
        supports_tool_use: false
        architecture: "MoE (320B total, 18B active; hybrid sparse/linear attention)"
        capabilities:
          - reasoning
          - code_review
          - code_generation
          - long_horizon_agentic
          - tool_use
          - structured_output
          - thinking
          - multimodal
        notes: >-
          Low-cost multimodal Flash sibling with text, image, video and file
          input. Thinking is always enabled; prompt-based structured output is
          used until forced tool use while thinking is live-verified. The CLI
          currently sends source text only, so its visual input capability is
          not used during code review.

      # GLM-5.2 (Z.AI) removed 2026-09-09 as CURATION: GLM-5.3 uses the same
      # base model with stronger post-training, the same $1.40/$4.40 rate, 1M
      # context and 128K output ceiling. The endpoint remains live. Neutral
      # aliases `glm`, `zai-glm` and `glm-zai` moved to 5.3; version-explicit
      # `zhipuai/glm-5.2`, `glm-5.2`, `glm5.2` and `glm5.2-zai` were deleted.

      # GLM-5.1 (Z.AI) removed 2026-07-25: superseded first by GLM-5.2 and now
      # by GLM-5.3 at the SAME $1.40/$4.40 list price, with a 1M context instead
      # of 203K. Still live on Z.AI; re-add from git history if needed.

  # OpenAI-on-Bedrock Provider (OpenAI-compatible endpoint)
  # AWS hosts OpenAI's frontier models (GPT-5.6 Sol here) and xAI's Grok on
  # Amazon Bedrock through this surface. The provider is named for OpenAI but is
  # NOT OpenAI-only — Grok rode the same endpoint until 2026-08-29, so a
  # non-OpenAI vendor arriving on bedrock-mantle belongs here, not in a new
  # provider.
  # This is a DIFFERENT path from the SigV4-based "bedrock" provider
  # above: the OpenAI-compatible surface authenticates with an Amazon Bedrock
  # API KEY (a bearer token, NOT AWS creds) and is driven with langchain-openai's
  # ChatOpenAI + custom base_url — same mechanism as the Z.AI provider.
  #
  #   OPENAI_API_KEY        → the Amazon Bedrock API key (generate in the
  #                           Bedrock console; this is NOT an openai.com key)
  #   OPENAI_BASE_URL       → your region's Bedrock OpenAI endpoint
  #   BEDROCK_OPENAI_MODEL_ID → paste into each model's `full_id` below
  #
  # No new dependency: langchain-openai (already required) pulls the `openai`
  # SDK, which reads OPENAI_API_KEY/OPENAI_BASE_URL natively.
  #
  # full_id holds the wire-level model id. It is a LITERAL here (not
  # ${BEDROCK_OPENAI_MODEL_ID}) because an unset env var would expand to "" and
  # fail full_id's min_length validation, breaking --list-models. Replace the
  # placeholders below with the exact model IDs from your Bedrock console.
  bedrock_openai:
    api_key: "${OPENAI_API_KEY}"
    base_url: "${OPENAI_BASE_URL}"
    request_timeout: 300
    models:
      # GPT-5.4 (Bedrock) removed 2026-07-25 and GPT-5.5 (Bedrock) removed
      # 2026-08-29 - gpt5.6-sol-bedrock below is the only OpenAI entry left on
      # this endpoint. Both are still LIVE on bedrock-mantle (5.4 probed HTTP
      # 200 on 2026-07-25; 5.5 probed HTTP 200 on the us-east-2 mantle base on
      # 2026-08-29), so both removals were CURATION - re-add from git history if
      # a generation comparison is wanted.
      #   openai.gpt-5.4  superseded at identical $2.50/$15 by 5.5.
      #   openai.gpt-5.5  superseded by GPT-5.6 Sol, which is OpenAI's best
      #     coding model to date. Two things you give up, recorded because the
      #     successor is not a free upgrade: Sol costs 2x ($5/$30 vs $2.50/$15),
      #     and 5.5 had the wider context window (400K vs Sol's 272K). If
      #     per-token cost matters more than coding rank, the GPT-5.6 Terra
      #     ($2.50/$15) and Luna ($1/$6) tiers are the intended replacements -
      #     add them the way the Sol entry below is written.
      # NOTE: GPT-5.4 on *Azure* is a separate entry and stays - that's a
      # user-created deployment, and it's the newest GPT on that resource.
      #
      # Alias disposition: the generation-neutral `gpt-bedrock` MIGRATED to
      # gpt5.6-sol-bedrock, as a deprecated_alias - it names "the GPT on
      # Bedrock", which Sol now is. It stays unadvertised BECAUSE OF THE PRICE:
      # following the name forward doubles the per-token rate, and a name that
      # silently costs 2x should not be in the advertised list. The
      # version-explicit ids `gpt5.5-bedrock` and `gpt5.4-bedrock` were DELETED.
      #
      # Evidence worth keeping from the 5.5 entry: its supports_tool_use: false
      # was VERIFIED against the live endpoint, not assumed. GPT-5.5 engaged
      # server-side reasoning per request (adaptive), and on batches where it
      # thought it returned ONLY a reasoning block with tool_calls=[] and no
      # `parsed` field, so the forced tool_choice that .with_structured_output()
      # sets had nothing to parse ("Structured Output response does not have a
      # 'parsed' field"). Intermittent - it failed exactly on the think-heavy
      # batches. That observation is the basis for the Sol entry's flag below.

      # GPT-5.6 Sol — OpenAI's flagship of the GPT-5.6 family (Sol/Terra/Luna),
      # GA on Amazon Bedrock (launched 2026-07-13) via the OpenAI-compatible
      # `bedrock-mantle` endpoint, and after the 2026-08-29 pass the ONLY entry
      # left on it. We pick the Sol tier because it is OpenAI's best coding model
      # to date (SOTA on the Artificial Analysis Coding Agent Index,
      # Terminal-Bench 2.1, and DeepSWE) — the right match for code review. Terra
      # ($2.50/$15) and Luna ($1/$6) are the cheaper balanced / high-volume tiers
      # (ids openai.gpt-5.6-terra / openai.gpt-5.6-luna) — add them the same way
      # if a cheaper run is wanted; they are also what replaces the removed
      # GPT-5.5 entry on price rather than on capability.
      #
      # Reasoning model: the model card lists ONLY the Responses endpoint (Chat
      # Completions, Converse, and bedrock-runtime are all NOT supported), so
      # use_responses_api: true is REQUIRED here. Rejects temperature/top_p like
      # the rest of the GPT-5.x family. In-Region only: us-east-1 / us-east-2
      # (NOT us-west-2) — pin OPENAI_BASE_URL to one of those.
      - id: gpt5.6-sol-bedrock
        full_id: openai.gpt-5.6-sol
        name: GPT-5.6 Sol (Bedrock)
        # In-Region us-east-1 / us-east-2 only. The provider rewrites the Region
        # label of OPENAI_BASE_URL to this value, so Sol and Astra (us-west-2
        # only) both work from one export; without it the other one's endpoint
        # 404s the model id rather than falling back. Re-read the model card's
        # bedrock-mantle availability table before changing this.
        region: us-east-1
        aliases:
          - gpt5.6
          - gpt-5.6
          - gpt5.6-bedrock
        # Back-compat only: resolves, but hidden from --list-models
        # (see --list-models --verbose).
        # Inherited 2026-08-29 from the removed GPT-5.5 (Bedrock) entry. Kept
        # unadvertised because following it forward DOUBLES the per-token rate
        # ($2.50/$15 -> $5/$30) and narrows the context window (400K -> 272K);
        # see the removal note above.
        deprecated_aliases:
          - gpt-bedrock
        pricing:
          # OpenAI list price for Sol (per the GPT-5.6 launch): $5 in / $30 out
          # per 1M. Cache reads get the 90% discount ($0.50); cache writes bill
          # at 1.25x input. Only input/output are read by the bedrock_openai
          # pricing path (extra keys ignored).
          input_per_million: 5.00
          output_per_million: 30.00
        inference_params:
          # No default_temperature/top_p — GPT-5.6 reasoning models reject them
          # (as did GPT-5.5/5.4 on this endpoint). Reasoning effort defaults
          # server-side; left unset so operators can tune per request.
          max_output_tokens: 128000
        use_responses_api: true
        # Model card: 272K-token context window.
        context_window: 272000
        # Adaptive server-side reasoning, same as GPT-5.5/5.4 had on this
        # endpoint: think-heavy batches return a reasoning-only response
        # (tool_calls=[], no `parsed`), which breaks the forced tool_choice that
        # .with_structured_output() sets ("no 'parsed' field"). Route through
        # prompt-based JSON parsing. The GPT-5.5 behavior this rests on was
        # verified live before that entry was removed — the evidence is preserved
        # in the removal note above, not just in git history.
        supports_tool_use: false
        capabilities:
          - reasoning
          - code_review
          - code_generation
          - security_analysis
          - structured_output
        notes: >-
          OpenAI GPT-5.6 Sol (flagship of the Sol/Terra/Luna family) hosted on
          Amazon Bedrock via the OpenAI-compatible bedrock-mantle endpoint
          (bearer-key auth, ChatOpenAI + base_url — NOT the SigV4 Converse path).
          Best-in-class coding/agentic reasoning, 272K context. Responses API
          only (no Chat Completions), no temperature/top_p. Structured output via
          prompt-based JSON parsing (supports_tool_use: false) — the same
          reasoning-only failure mode verified on GPT-5.5 on Bedrock. In-Region
          only: us-east-1 / us-east-2.

      # GPT-6 Astra — OpenAI's most capable model, GA on Amazon Bedrock
      # 2026-09-08 (model card: launch 2026-09-08, knowledge cutoff 2026-04-30,
      # EOL no sooner than 2027-09-08). Second entry on this provider, alongside
      # GPT-5.6 Sol. Two things about it are unlike every other entry in this
      # file; read both before touching it.
      #
      # (1) THE REGION IS INCOMPATIBLE WITH SOL'S. `base_url` is
      #     PROVIDER-level (`${OPENAI_BASE_URL}`), and on `bedrock-mantle` Astra
      #     is served from `us-west-2` ONLY, while Sol is In-Region
      #     us-east-1/us-east-2 only. One OPENAI_BASE_URL cannot reach both:
      #       Astra: https://bedrock-mantle.us-west-2.api.aws/openai/v1
      #       Sol:   https://bedrock-mantle.us-east-1.api.aws/openai/v1
      #     Pointing at the wrong one 404s the model id, it does not fall back —
      #     on EVERY batch of the run, which is what it looked like in the field
      #     on 2026-09-13 (four batches, four identical "The model
      #     'openai.gpt-6-astra' does not exist" 404s).
      #     This used to be an operator switch — re-export OPENAI_BASE_URL to
      #     change models. It is now configuration: both entries carry `region:`
      #     and BedrockOpenAIProvider._resolve_base_url rewrites the Region label
      #     of the configured URL per model, so one export serves both. Only the
      #     Region label is rewritten, so OPENAI_BASE_URL still decides scheme,
      #     host and path. Do NOT "fix" a 404 here by widening Astra's region
      #     from memory — re-read the model card's bedrock-mantle availability
      #     table, which listed exactly one row on 2026-09-13.
      #
      # (2) FIRST ENTRY WITH TIERED PRICING. At 272K input tokens or fewer one
      #     request bills $11/$55 per 1M; above that the SAME request bills
      #     $22/$82.50 (In-Region, short vs long context). This entry used to
      #     clamp context_window to 272000 so the batcher could not pack past
      #     the price break, because a single flat input/output pair would have
      #     reported half the billed cost — the same under-reporting class as
      #     the Azure gpt-5.4 usage_metadata bug, and CLAUDE.md's rule is that
      #     a wrong pricing number is the worst kind of wrong because the next
      #     reader trusts it. The clamp is gone now that pricing is tier-aware:
      #     the three long_* keys below are read by
      #     PricingConfig.rates_for_request, which picks the tier from ONE
      #     request's input size, and TokenTrackingMixin._track_tokens prices
      #     each request as it lands. The threshold is PER REQUEST, never per
      #     run — five 100K batches total 500K tokens and still bill entirely
      #     at the short rate, so never apply it to an accumulated total.
      - id: gpt6-astra-bedrock
        full_id: openai.gpt-6-astra
        name: GPT-6 Astra (Bedrock)
        # us-west-2 ONLY on bedrock-mantle -- see note (1) above. The provider
        # rewrites the Region label of OPENAI_BASE_URL to this value, which is
        # what lets this entry and Sol (us-east-1/us-east-2) coexist under one
        # provider-level export. Do NOT widen this from memory.
        region: us-west-2
        aliases:
          - gpt6
          - gpt-6
          - gpt6-bedrock
        pricing:
          # bedrock-mantle is In-Region us-west-2, so these are the In-Region
          # rates: SHORT context ($11 / $55 per 1M) for a request at or below
          # the threshold, LONG context ($22 / $82.50) above it. AWS notes
          # In-Region includes a 10% fee over OpenAI's own rates — already
          # baked into these numbers, do not add it again. Global CRIS
          # ($10/$50) is not reachable from this entry's endpoint. Cache reads
          # $1.10, 30m cache writes $13.75 — not read by the bedrock_openai
          # pricing path.
          input_per_million: 11.00
          output_per_million: 55.00
          long_context_threshold_tokens: 272000
          long_input_per_million: 22.00
          long_output_per_million: 82.50
        inference_params:
          # No default_temperature/top_p — reasoning model, same as the rest of
          # the GPT-5.x/6 family on this endpoint. Reasoning effort defaults
          # server-side; left unset so operators can tune per request.
          max_output_tokens: 128000
        # Both Responses and Chat Completions are supported on bedrock-mantle
        # (unlike Sol, which is Responses-only), but Responses is what carries
        # reasoning summaries, so keep it.
        use_responses_api: true
        # A conservative round number under the card's 1,050,000, same
        # convention as the Gemini entries. No longer clamped to the 272K
        # pricing break — see (2) above; batches that cross it are priced at
        # the long-context rates instead of under-reported.
        context_window: 1000000
        # LIVE-VERIFIED 2026-09-13, not assumed — and the A/B is worth keeping
        # because the failure shape here is NOT the one GPT-5.5 showed.
        # Reviewing `codereview/providers/` (2 batches, ~98K input tokens, a
        # genuinely think-heavy target) on the us-west-2 mantle base:
        #   supports_tool_use: true  -> batch 1 of 2 DIED. The Responses API
        #     returned ResponseError(code='server_error', message='The server
        #     had an error while processing your request.') — surfaced by
        #     base.py's `raise ValueError(response.error)`. Retries burned the
        #     whole budget: 3m06s wall clock for a half-finished review, and
        #     the run reported "1/2 batch(es) failed".
        #   supports_tool_use: false -> both batches completed in 37.4s and
        #     found 4 issues. Same target, same key, same Region.
        # So a forced `tool_choice` on a think-heavy batch makes this endpoint
        # 500, where GPT-5.5 instead returned a reasoning-only response
        # (tool_calls=[], no `parsed`). Different symptom, same root cause and
        # same fix. Note it is a *server_error*, which reads as transient — do
        # not "fix" a recurrence by widening the retry classifier, and do not
        # flip this back on the strength of a small batch: trivial inputs pass
        # forced tool_choice cleanly (a 12-line file did), so only a think-heavy
        # target reproduces it.
        supports_tool_use: false
        capabilities:
          - reasoning
          - code_review
          - code_generation
          - security_analysis
          - computer_use
          - vision
        notes: >-
          OpenAI GPT-6 Astra, OpenAI's most capable model, hosted on Amazon
          Bedrock via the OpenAI-compatible bedrock-mantle endpoint (bearer-key
          auth, ChatOpenAI + base_url — NOT the SigV4 Converse path). Text +
          image input, 1.05M-token model context that we deliberately clamp to
          272K to stay inside the cheaper pricing tier, 128K max output.
          Responses API, no temperature/top_p, structured output via
          prompt-based JSON parsing. bedrock-mantle serves it from us-west-2
          ONLY — which is mutually exclusive with GPT-5.6 Sol's us-east-1 /
          us-east-2, since OPENAI_BASE_URL is provider-wide.

      # Grok 4.3 (Bedrock) removed 2026-08-29, and with it xAI leaves this
      # registry entirely — there is no other Grok entry on any provider.
      # `xai.grok-4.3` is still LIVE on bedrock-mantle, so this was CURATION, and
      # it is the removal in this pass that costs the most, so read this before
      # deciding not to re-add it:
      #   - It was the CHEAPEST entry on bedrock_openai by a wide margin
      #     ($1.25/$2.50 against GPT-5.6 Sol's $5/$30 — 12x on output). This
      #     provider now starts at $5/$30.
      #   - It had the widest context here (1M vs Sol's 272K).
      #   - It was the ONLY entry on this provider that ACCEPTED temperature/top_p
      #     (card defaults 0.7/0.95; we sent 0.3 for deterministic review) and so
      #     the only one on plain Chat Completions rather than the Responses API —
      #     which made it the reference case for `use_responses_api` being
      #     optional on bedrock-mantle rather than implied by it.
      # Re-add from git history if a cheap wide-context reviewer is wanted; the
      # cheaper GPT-5.6 Terra/Luna tiers are the in-family alternative, but they
      # are Responses-only reasoning models and reject sampling params.
      #
      # Every Grok identifier was DELETED, including the version-neutral `grok`
      # and `grok-bedrock` that the convention would normally migrate: no xAI
      # model remains to migrate them onto, so the family fails fast rather than
      # answering from OpenAI (same reasoning as `step-flash` and `qwen`). Also
      # deleted: `grok-4.3`, `grok43` and the entry id `grok-4.3-bedrock`.

# Default model configuration
defaults:
  bedrock_default: opus5
  azure_default: gpt-5.4
  # Updated 2026-08-29: was mistral-medium-nvidia, whose endpoint NVIDIA EOL'd.
  # Updated 2026-09-19: was deepseek-v4-flash-nvidia, sunset 2026-09-21. The
  # Flash GLM rather than the 753B flagship — `glm53-nvidia` took 4m50s to
  # return 8 tokens when probed, which is not a sane default.
  nvidia_default: glm-5.3-flash-nvidia
  zai_default: zhipuai/glm-5.3
  deepseek_default: deepseek-v4-pro
  moonshot_default: kimi-k3
  aws_region: us-west-2
  max_tokens: 16000

# File scanning configuration
scanning:
  max_file_size_kb: 500
  warn_file_size_kb: 100
  exclude_patterns:
    # Dependency directories
    - "**/node_modules/**"
    - "**/.venv/**"
    - "**/venv/**"
    - "**/vendor/**"
    # Build outputs
    - "**/dist/**"
    - "**/build/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/*.pyo"
    # Version control
    - "**/.git/**"
    - "**/.svn/**"
    # IDE and editors
    - "**/.vscode/**"
    - "**/.idea/**"
    - "**/*.swp"
    # Test fixtures and generated code
    - "**/test_data/**"
    - "**/fixtures/**"
    - "**/*_pb2.py"
    - "**/*_pb2_grpc.py"
    # Common non-review files
    - "**/*.min.js"
    - "**/*.min.css"
    - "**/migrations/**"
    - "**/*.lock"
  exclude_extensions:
    - ".json"
    - ".yaml"
    - ".yml"
    - ".toml"
    - ".md"
    - ".txt"
    - ".rst"
    - ".jpg"
    - ".png"
    - ".gif"
    - ".svg"
    - ".bin"
    - ".exe"
    - ".so"
    - ".dylib"
    - ".pyc"
    - ".pyo"

# Code Review Recommendations
#
# For accurate, deterministic code review:
# - Use temperature 0.0-0.3 (lower = consistent)
# - Use top_p 0.8-0.95 for controlled output
# - Prefer models with strong SWE-bench scores
#
# Model selection by use case. Prices are input/output per million tokens and
# WILL drift — `codereview --list-models` prints them from the entries below and
# is the authoritative view. Every figure that used to be quoted here had gone
# stale, and one named a model that no longer exists at all.
# - Free: any NVIDIA NIM entry (free tier; $0/$0 above)
# - Quick: Haiku 4.5 (the only sub-$3 Bedrock entry after the 2026-08-29 pass)
# - Standard: Sonnet 5, Gemini 3.8 Flash, GLM-5.3 (Z.AI)
# - Complex: Opus 5 (the CLI default), GPT-5.6 Sol (Bedrock)
# - Budget-with-a-key: DeepSeek-V4-Flash, Kimi K2.6 (Moonshot)
