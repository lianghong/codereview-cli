          # Update if upstream changes; treat as a starting estimate
          # since the docs page wasn't directly fetchable at config time.
          input_per_million: 0.60
          output_per_million: 2.50
        inference_params:
          # Moonshot's K2.6 server-side enforces temperature=1.0 and
          # top_p=0.95 (same constraint as K2.5 with thinking enabled).
          # Sending any other value yields HTTP 400:
          #   "invalid temperature: only 1 is allowed for this model".
          # K2.6 is trained for sufficient determinism at fixed t=1.0;
          # do NOT lower for code review here.
          default_temperature: 1.0
          default_top_p: 0.95
          max_output_tokens: 16384
        context_window: 262144
        # Moonshot's server rejects `tool_choice='specified'` while
        # K2.6's implicit thinking mode is enabled (HTTP 400:
        # "tool_choice 'specified' is incompatible with thinking
        # enabled"). `.with_structured_output()` would set exactly
        # that tool_choice under the hood, so we route K2.6 through
        # prompt-based JSON parsing instead — same pattern as MiniMax
        # M2.5 on Bedrock and DeepSeek-V4-Pro on Azure.
        supports_tool_use: false
        architecture: "MoE (1T total, 32B active, 384 experts)"
        capabilities:
          - reasoning
          - code_review
          - code_generation
          - long_horizon_agentic
          - structured_output
          - thinking
        notes: >-
          Long-horizon agentic coding with thinking mode. Tool use
          conflicts with thinking on Moonshot's server, so structured
          output is produced via prompt-based JSON parsing
          (PydanticOutputParser) — see supports_tool_use above.

  # Z.AI (Zhipu International) Provider
  # OpenAI-compatible endpoint at https://api.z.ai/api/paas/v4/
  # Models exposed via langchain-openai's ChatOpenAI with custom base_url
  # — no langchain-community dependency.
  zai:
    api_key: "${ZAI_API_KEY}"
    base_url: "https://api.z.ai/api/paas/v4/"
    request_timeout: 300
    models:
      # GLM-5.2 (Z.AI) — current Zhipu flagship, supersedes GLM-5.1.
      # Long-horizon engineering model: "truly usable 1M-token context" for
      # project-scale coding/refactoring, more stable long-task execution, and
      # tighter adherence to engineering standards. Thinking/reasoning mode +
      # function calling + MCP. https://docs.z.ai/guides/llm/glm-5.2
      - id: zhipuai/glm-5.2
        full_id: glm-5.2
        name: GLM-5.2 (Z.AI)
        aliases:
          - glm
          - glm-5.2
          - glm5.2
          - glm5.2-zai
          - zai-glm
          - glm-zai
        # 2026-07-25: the GLM-5.1 back-compat names (zhipuai/glm-5.1 - the
        # removed entry's id - and glm5.1-zai) were deleted, not migrated.
        # Use `glm` (generation-neutral) or `glm-5.2`.
        pricing:
          # Official docs.z.ai pricing page: $1.40 / $4.40 per 1M tokens
          # (same list price as GLM-5.1).
          input_per_million: 1.40
          output_per_million: 4.40
        inference_params:
          # GLM-5.2 is a thinking model. The vendor's examples pair thinking
          # with temperature 1.0 (non-streaming) / 0.6 (streaming). For
          # deterministic code review we take the LOWER documented value (0.6):
          # it curbs variance/hallucinated line numbers without starving the
          # reasoning pass — pushing lower (<=0.3) tends to destabilize thinking
          # models. top_p matches the model card. NOTE: thinking is governed
          # server-side on Z.AI's OpenAI-compat endpoint; ZAIProvider does not
          # forward enable_thinking/reasoning_effort, so they're omitted here.
          default_temperature: 0.6
          default_top_p: 0.95
          max_output_tokens: 16384
        # Docs: "truly usable 1M-token context" (1024*1024 tokens).
        context_window: 1048576
        # Same path the retired GLM-5.1 entry used: Z.AI's OpenAI-compat
        # endpoint ignores the json_schema response_format that
        # .with_structured_output() sets and returns markdown-fenced JSON,
        # which the json_schema parser rejects with
        # "Invalid JSON: expected value at line 1 column 1". GLM-5.2 is
        # additionally a thinking model, so per the "assume prompt-parsing until
        # a live run proves tool-use" rule it stays on the PydanticOutputParser
        # path regardless. (PydanticOutputParser strips the ```json fences.)
        supports_tool_use: false
        capabilities:
          - reasoning
          - code_review
          - code_generation
          - long_horizon_agentic
          - tool_use
          - structured_output
        notes: >-
          Current Zhipu flagship (supersedes GLM-5.1). 1M-token context for
          project-scale coding, stable long-horizon execution, thinking mode.
          OpenAI-compatible endpoint; structured output via prompt-based JSON
          parsing (supports_tool_use: false) — Z.AI returns markdown-fenced JSON.

      # GLM-5.1 (Z.AI) removed 2026-07-25: superseded by GLM-5.2 above at the
      # SAME $1.40/$4.40 list price, with a 1M context instead of 203K — no
      # reason to pick 5.1. Still live on Z.AI, so re-add from git history if
      # needed. GLM-5.2 absorbed its aliases.

  # OpenAI-on-Bedrock Provider (OpenAI-compatible endpoint)
  # AWS hosts OpenAI's frontier models (GPT-5.5, GPT-5.6 Sol) and xAI's Grok
  # on Amazon Bedrock.
  # This is a DIFFERENT path from the SigV4-based "bedrock" provider
  # above: the OpenAI-compatible surface authenticates with an Amazon Bedrock
  # API KEY (a bearer token, NOT AWS creds) and is driven with langchain-openai's
  # ChatOpenAI + custom base_url — same mechanism as the Z.AI provider.
  #
  #   OPENAI_API_KEY        → the Amazon Bedrock API key (generate in the
  #                           Bedrock console; this is NOT an openai.com key)
  #   OPENAI_BASE_URL       → your region's Bedrock OpenAI endpoint
  #   BEDROCK_OPENAI_MODEL_ID → paste into each model's `full_id` below
  #
  # No new dependency: langchain-openai (already required) pulls the `openai`
  # SDK, which reads OPENAI_API_KEY/OPENAI_BASE_URL natively.
  #
  # full_id holds the wire-level model id. It is a LITERAL here (not
  # ${BEDROCK_OPENAI_MODEL_ID}) because an unset env var would expand to "" and
  # fail full_id's min_length validation, breaking --list-models. Replace the
  # placeholders below with the exact model IDs from your Bedrock console.
  bedrock_openai:
    api_key: "${OPENAI_API_KEY}"
    base_url: "${OPENAI_BASE_URL}"
    request_timeout: 300
    models:
      # GPT-5.5 — OpenAI frontier reasoning model, GA on Amazon Bedrock.
      # Reasoning model: rejects temperature/top_p (no default_temperature),
      # surfaces reasoning summaries via the Responses API (use_responses_api).
      #
      # supports_tool_use: false — verified against the live endpoint. GPT-5.5
      # engages server-side reasoning per request (adaptive), and on batches
      # where it thinks it returns ONLY a reasoning block with tool_calls=[] and
      # no `parsed` field, so the forced tool_choice that .with_structured_output()
      # sets has nothing to parse ("Structured Output response does not have a
      # 'parsed' field"). This is intermittent — it fails exactly on the
      # think-heavy batches — the same failure mode as Opus 4.8 on Bedrock.
      # Route through prompt-based JSON parsing (PydanticOutputParser) instead.
      - id: gpt5.5-bedrock
        # TODO: replace with the exact model id from your Bedrock console /
        # the value of BEDROCK_OPENAI_MODEL_ID (e.g. "openai.gpt-5.5-...:0").
        full_id: openai.gpt-5.5
        name: GPT-5.5 (Bedrock)
        aliases:
          - gpt-bedrock
        # 2026-07-25: the GPT-5.4-on-Bedrock back-compat alias
        # (gpt5.4-bedrock) was deleted, not migrated. Use `gpt-bedrock`
        # (generation-neutral) or the id `gpt5.5-bedrock`.
        pricing:
          # TODO: confirm Bedrock-hosted rates from the AWS pricing page.
          # Placeholder mirrors OpenAI-direct GPT-5 family list pricing.
          input_per_million: 2.50
          output_per_million: 15.00
        inference_params:
          # No default_temperature/top_p — GPT-5 reasoning models reject them.
          max_output_tokens: 128000
        use_responses_api: true
        context_window: 400000
        supports_tool_use: false
        capabilities:
          - reasoning
          - code_review
          - security_analysis
          - structured_output
        notes: >-
          OpenAI GPT-5.5 hosted on Amazon Bedrock via the OpenAI-compatible
          endpoint (bearer-key auth, ChatOpenAI + base_url). Reasoning model:
          Responses API, no temperature/top_p. Structured output via prompt-based
          JSON parsing — adaptive thinking returns reasoning-only responses that
          break forced tool_choice (supports_tool_use: false).

      # GPT-5.4 (Bedrock) removed 2026-07-25: two newer OpenAI generations ride
      # the same bedrock-mantle endpoint (GPT-5.5 above at identical $2.50/$15,
      # and GPT-5.6 Sol below), so the 5.4 entry added no capability. Still
      # responds on the endpoint (probed HTTP 200), so re-add from git history
      # if a specific comparison needs it. GPT-5.5 absorbed its alias.
      # NOTE: GPT-5.4 on *Azure* is a separate entry and stays — that's a
      # user-created deployment, and it's the newest GPT on that resource.

      # GPT-5.6 Sol — OpenAI's flagship of the GPT-5.6 family (Sol/Terra/Luna),
      # GA on Amazon Bedrock (launched 2026-07-13) via the same OpenAI-compatible
      # `bedrock-mantle` endpoint as GPT-5.5/5.4 and Grok above. We pick the Sol
      # tier because it is OpenAI's best coding model to date (SOTA on the
      # Artificial Analysis Coding Agent Index, Terminal-Bench 2.1, and DeepSWE) —
      # the right match for code review. Terra ($2.50/$15) and Luna ($1/$6) are
      # the cheaper balanced / high-volume tiers (ids openai.gpt-5.6-terra /
      # openai.gpt-5.6-luna) — add them the same way if a cheaper run is wanted.
      #
      # Reasoning model: the model card lists ONLY the Responses endpoint (Chat
      # Completions, Converse, and bedrock-runtime are all NOT supported), so
      # use_responses_api: true is REQUIRED here (not optional as it is for the
      # temperature-accepting Grok). Rejects temperature/top_p like the GPT-5.x
      # siblings. In-Region only: us-east-1 / us-east-2 (NOT us-west-2 — a
      # narrower set than Grok) — pin OPENAI_BASE_URL to one of those.
      - id: gpt5.6-sol-bedrock
        full_id: openai.gpt-5.6-sol
        name: GPT-5.6 Sol (Bedrock)
        aliases:
          - gpt5.6
          - gpt-5.6
          - gpt5.6-bedrock
        pricing:
          # OpenAI list price for Sol (per the GPT-5.6 launch): $5 in / $30 out
          # per 1M. Cache reads get the 90% discount ($0.50); cache writes bill
          # at 1.25x input. Only input/output are read by the bedrock_openai
          # pricing path (extra keys ignored), matching the GPT-5.5/5.4 entries.
          input_per_million: 5.00
          output_per_million: 30.00
        inference_params:
          # No default_temperature/top_p — GPT-5.6 reasoning models reject them
          # (same as GPT-5.5/5.4 on this endpoint). Reasoning effort defaults
          # server-side; left unset so operators can tune per request.
          max_output_tokens: 128000
        use_responses_api: true
        # Model card: 272K-token context window (narrower than Grok's 1M).
        context_window: 272000
        # Adaptive server-side reasoning like GPT-5.5/5.4 on this endpoint:
        # think-heavy batches return a reasoning-only response (tool_calls=[],
        # no `parsed`), which breaks the forced tool_choice that
        # .with_structured_output() sets ("no 'parsed' field"). Route through
        # prompt-based JSON parsing per the verified GPT-5.5/5.4-on-Bedrock
        # behavior and the assume-prompt-parsing rule.
        supports_tool_use: false
        capabilities:
          - reasoning
          - code_review
          - code_generation
          - security_analysis
          - structured_output
        notes: >-
          OpenAI GPT-5.6 Sol (flagship of the Sol/Terra/Luna family) hosted on
          Amazon Bedrock via the OpenAI-compatible bedrock-mantle endpoint
          (bearer-key auth, ChatOpenAI + base_url — NOT the SigV4 Converse path).
          Best-in-class coding/agentic reasoning, 272K context. Responses API
          only (no Chat Completions), no temperature/top_p. Structured output via
          prompt-based JSON parsing (supports_tool_use: false) — same
          reasoning-only failure mode as GPT-5.5/5.4 on Bedrock. In-Region only:
          us-east-1 / us-east-2.

      # Grok 4.3 (xAI) — reasoning-first frontier model, GA on Amazon Bedrock
      # via the NEW `bedrock-mantle` OpenAI-compatible endpoint. Despite being a
      # Bedrock model it does NOT use the SigV4 Converse path (ChatBedrockConverse):
      # the model card lists Converse and bedrock-runtime as NOT supported — only
      # Chat Completions / Responses on bedrock-mantle. That is the SAME transport
      # as the GPT-5.x-on-Bedrock entries above (ChatOpenAI + base_url + a Bedrock
      # API key bearer token via OPENAI_API_KEY/OPENAI_BASE_URL), so it lives in
      # this bedrock_openai provider. The bedrock-mantle base URL is
      # https://bedrock-mantle.{region}.api.aws/openai/v1 (already what
      # OPENAI_BASE_URL points at for GPT-5.x-on-Bedrock — same host).
      #
      # UNLIKE the GPT-5.x reasoning models here, Grok 4.3 ACCEPTS temperature and
      # top_p (model card defaults: temperature 0.7, top_p 0.95), so we DON'T set
      # use_responses_api (which would skip the sampling params) and instead pass a
      # low temperature for deterministic review over plain Chat Completions.
      - id: grok-4.3-bedrock
        full_id: xai.grok-4.3
        name: Grok 4.3 (Bedrock)
        aliases:
          - grok
          - grok-4.3
          - grok43
          - grok-bedrock
        pricing:
          # Third-party aggregator rates (AWS pricing page links out without a
          # per-token table for Mantle at config time). Update from
          # https://aws.amazon.com/bedrock/pricing/ once published.
          input_per_million: 1.25
          output_per_million: 2.50
        inference_params:
          # Grok 4.3 accepts temperature/top_p (card defaults 0.7/0.95); lowered
          # to 0.3 for deterministic code review. Card default max_completion_tokens
          # is 131072; we cap lower to bound per-batch cost + leave reasoning room.
          default_temperature: 0.3
          default_top_p: 0.95
          max_output_tokens: 32000
        # Model card: 1M-token context window.
        context_window: 1000000
        # Reasoning-first model with ALWAYS-ON reasoning (effort configurable but
        # not disable-by-default) — the highest-risk profile for the forced
        # tool_choice-while-thinking conflict. The GPT-5.5/5.4 entries on this SAME
        # bedrock-mantle endpoint are already supports_tool_use: false for that
        # reason. Route through prompt-based JSON parsing per the assume-prompt-
        # parsing rule; flip to true only if a live run proves tool-use works.
        supports_tool_use: false
        capabilities:
          - reasoning
          - code_review
          - security_analysis
          - structured_output
          - tool_use
        notes: >-
          xAI Grok 4.3 on Amazon Bedrock via the OpenAI-compatible bedrock-mantle
          endpoint (bearer-key auth, ChatOpenAI + base_url — NOT the SigV4 Converse
          path). Reasoning-first, always-on reasoning, 1M context. Accepts
          temperature/top_p (Chat Completions, not Responses API). Structured
          output via prompt-based JSON parsing (supports_tool_use: false).
          In-Region only: us-west-2 / us-east-1 / us-east-2 (no Geo/Global).

# Default model configuration
defaults:
  bedrock_default: opus5
  azure_default: gpt-5.4
  nvidia_default: mistral-medium-nvidia
  zai_default: zhipuai/glm-5.2
  deepseek_default: deepseek-v4-pro
  moonshot_default: kimi-k2.6
  aws_region: us-west-2
  max_tokens: 16000

# File scanning configuration
scanning:
  max_file_size_kb: 500
  warn_file_size_kb: 100
  exclude_patterns:
    # Dependency directories
    - "**/node_modules/**"
    - "**/.venv/**"
    - "**/venv/**"
    - "**/vendor/**"
    # Build outputs
    - "**/dist/**"
    - "**/build/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/*.pyo"
    # Version control
    - "**/.git/**"
    - "**/.svn/**"
    # IDE and editors
    - "**/.vscode/**"
    - "**/.idea/**"
    - "**/*.swp"
    # Test fixtures and generated code
    - "**/test_data/**"
    - "**/fixtures/**"
    - "**/*_pb2.py"
    - "**/*_pb2_grpc.py"
    # Common non-review files
    - "**/*.min.js"
    - "**/*.min.css"
    - "**/migrations/**"
    - "**/*.lock"
  exclude_extensions:
    - ".json"
    - ".yaml"
    - ".yml"
    - ".toml"
    - ".md"
    - ".txt"
    - ".rst"
    - ".jpg"
    - ".png"
    - ".gif"
    - ".svg"
    - ".bin"
    - ".exe"
    - ".so"
    - ".dylib"
    - ".pyc"
    - ".pyo"

# Code Review Recommendations
#
# For accurate, deterministic code review:
# - Use temperature 0.0-0.3 (lower = consistent)
# - Use top_p 0.8-0.95 for controlled output
# - Prefer models with strong SWE-bench scores
#
# Model selection by use case. Prices are input/output per million tokens and
# WILL drift — `codereview --list-models` prints them from the entries below and
# is the authoritative view. Every figure that used to be quoted here had gone
# stale, and one named a model that no longer exists at all.
# - Free: any NVIDIA NIM entry (free tier; $0/$0 above)
# - Quick: Haiku 4.5, Qwen3 Coder Next (Bedrock)
# - Standard: Sonnet 4.6 / Sonnet 5, Gemini 3.6 Flash, Grok 4.3 (Bedrock)
# - Complex: Opus 5 (the CLI default), GPT-5.6 Sol (Bedrock)
# - Budget-with-a-key: DeepSeek-V4-Flash, Kimi K2.6 (Moonshot)
